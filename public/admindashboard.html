<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | DELICUTE</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8B6BC9;
      --primary-purple-dark: #6B4FA0;
      --bg-lilac: #F3EEFA;
      --dark: #2B2B33;
      --muted: #6B6B76;
      --border: #E7E1F2;
      --delivered: #2E8B57;
      --cancelled: #C0392B;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(60, 40, 100, 0.08);
      --shadow-md: 0 4px 14px rgba(60, 40, 100, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-lilac);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: relative;
      text-align: center;
    }

    header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
    header span { font-size: 0.8rem; opacity: 0.85; }

    .top-actions {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      position: relative;
      transition: background 0.2s ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.28); }

    .notification-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--cancelled);
      color: white;
      border-radius: 50%;
      min-width: 16px;
      height: 16px;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    .logout-btn {
      background: white;
      color: var(--primary-purple-dark);
      border: none;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .notification-dropdown {
      display: none;
      position: absolute;
      top: 3rem;
      right: 0;
      width: 260px;
      max-height: 320px;
      overflow-y: auto;
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      z-index: 1000;
      padding: 0.6rem;
      color: var(--dark);
      text-align: left;
    }
    .notification-dropdown.show { display: block; }

    .notification-item {
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .notification-item:last-child { border-bottom: none; }
    .notification-item strong { color: var(--primary-purple-dark); }

    .no-notifications { padding: 0.6rem; font-size: 0.82rem; color: var(--muted); text-align: center; }

    .clear-notifications {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.5rem;
      background: var(--bg-lilac);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-purple-dark);
      cursor: pointer;
    }

    nav {
      background: #1E1E24;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem;
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

    .content-wrapper {
      max-width: 900px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
    }

    .welcome-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .welcome-card .icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg-lilac);
      color: var(--primary-purple-dark);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.9rem;
    }

    .welcome-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--dark);
      margin-bottom: 0.4rem;
    }
    .welcome-card h2 span { color: var(--primary-purple-dark); }

    .welcome-card p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .quick-links {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .quick-link {
      background: var(--bg-lilac);
      border-radius: 8px;
      padding: 1rem 0.5rem;
      text-align: center;
      text-decoration: none;
      color: var(--primary-purple-dark);
      font-size: 0.82rem;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .quick-link i { display: block; font-size: 1.3rem; margin-bottom: 0.4rem; }
    .quick-link:hover { background: #E9E0F7; transform: translateY(-2px); }

    #toast {
      visibility: hidden;
      min-width: 200px;
      max-width: 90%;
      background: var(--delivered);
      color: white;
      text-align: center;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      position: fixed;
      z-index: 2000;
      top: 12px;
      right: 12px;
      font-size: 0.85rem;
      box-shadow: var(--shadow-md);
    }
    #toast.show {
      visibility: visible;
      animation: slideDown 0.4s ease-out, slideUp 0.4s ease-in 1.6s forwards;
    }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

    /* Tablet */
    @media (max-width: 860px) {
      .content-wrapper { max-width: 100%; }
      .quick-links { grid-template-columns: repeat(3, 1fr); }
    }

    /* Mobile */
    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      header img { height: 42px; }
      .top-actions { right: 0.5rem; gap: 0.35rem; }
      .icon-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .logout-btn { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; }
      nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
      .content-wrapper { margin: 1rem; padding: 0; }
      .welcome-card { padding: 1.5rem 1rem; }
      .welcome-card h2 { font-size: 1.2rem; }
      .quick-links { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-actions">
      <button class="icon-btn" id="notification-icon" title="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" id="notification-count">0</span>
      </button>
      <div class="notification-dropdown" id="notification-dropdown">
        <div id="notification-list"></div>
        <button class="clear-notifications" onclick="clearNotifications()">Clear All</button>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
  </header>

  <nav>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
    <a href="adminpromotions.html">Promotions</a>
  </nav>

  <div class="content-wrapper">
    <div class="welcome-card">
      <div class="icon-badge"><i class="fas fa-utensils"></i></div>
      <h2>Welcome back, <span id="admin-name">Admin</span> 🎉</h2>
      <p>Select a section below to manage your kitchen.</p>

      <div class="quick-links">
        <a href="adminorders.html" class="quick-link"><i class="fas fa-receipt"></i>Orders</a>
        <a href="adminmenu.html" class="quick-link"><i class="fas fa-book-open"></i>Menu</a>
        <a href="admincoupons.html" class="quick-link"><i class="fas fa-tags"></i>Coupons</a>
        <a href="admincategories.html" class="quick-link"><i class="fas fa-layer-group"></i>Categories</a>
        <a href="admintoppicks.html" class="quick-link"><i class="fas fa-star"></i>Top Picks</a>
        <a href="adminpromotions.html" class="quick-link"><i class="fas fa-bullhorn"></i>Promotions</a>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    function showToast(msg, success = true) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.background = success ? "#2E8B57" : "#C0392B";
      toast.className = "show";
      setTimeout(() => toast.className = toast.className.replace("show", ""), 2000);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("/api/auth/check", {
          credentials: "include",
          cache: "no-store"
        });
        if (!response.ok) {
          showToast("Authentication failed. Redirecting to login.", false);
          setTimeout(() => window.location.href = "/admin.html", 2000);
        } else {
          const data = await response.json();
          const adminName = data.user?.name || "Admin";
          document.getElementById("admin-name").textContent = adminName;
        }
      } catch (error) {
        console.error("Auth Check Error:", error);
        showToast("Authentication failed: " + error.message, false);
        setTimeout(() => window.location.href = "/admin.html", 2000);
      }
    });

    async function logout() {
      try {
        const response = await fetch("/api/auth/logout", {
          method: "POST",
          credentials: "include",
          cache: "no-store"
        });
        if (response.ok) {
          showToast("Logged out successfully!", true);
          setTimeout(() => window.location.href = "/admin.html", 1000);
        } else {
          throw new Error("Logout failed");
        }
      } catch (error) {
        console.error("Logout Error:", error);
        showToast("Logout failed: " + error.message, false);
      }
    }

    const socket = io({
      auth: { token: localStorage.getItem("token") || getCookie("token") },
      reconnectionAttempts: 3,
      timeout: 5000
    });

    const elements = {
      notificationCount: document.getElementById("notification-count"),
      notificationList: document.getElementById("notification-list"),
      notificationDropdown: document.getElementById("notification-dropdown"),
      notificationIcon: document.getElementById("notification-icon")
    };

    let notifications = JSON.parse(localStorage.getItem("notifications") || "[]");

    function updateNotificationCount() {
      elements.notificationCount.textContent = notifications.length;
      elements.notificationCount.style.display = notifications.length ? "flex" : "none";
    }

    function renderNotifications() {
      elements.notificationList.innerHTML = notifications.length
        ? notifications.map(n => `
            <div class="notification-item">
              <strong>Order #${n.id}</strong> by ${escapeHtml(n.customer_name)}<br>
              Table: ${n.table_number} | Total: ₹${n.total.toFixed(2)}
            </div>
          `).join("")
        : '<div class="no-notifications">No new notifications</div>';
      updateNotificationCount();
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      elements.notificationDropdown.classList.toggle("show");
    }

    function clearNotifications() {
      notifications = [];
      localStorage.setItem("notifications", JSON.stringify(notifications));
      renderNotifications();
      showToast("Notifications cleared!", true);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    elements.notificationIcon.addEventListener("click", toggleDropdown);
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#notification-icon")) {
        elements.notificationDropdown.classList.remove("show");
      }
    });

    socket.on("connect", () => console.log("WebSocket connected:", socket.id));
    socket.on("new-order", (order) => {
      notifications.unshift(order);
      localStorage.setItem("notifications", JSON.stringify(notifications));
      renderNotifications();
      showToast(`New order #${order.id} received!`, true);
    });
    socket.on("connect_error", (err) => {
      console.error("WebSocket Error:", err);
      showToast("WebSocket connection failed", false);
    });

    renderNotifications();

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      return parts.length === 2 ? parts.pop().split(";").shift() : null;
    }
  </script>
</body>
</html>

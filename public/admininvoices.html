<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Invoices</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8e44ad;
      --primary-purple-dark: #5c3a52;
      --nav-dark: #3f2838;
      --bg-lilac: #fbf6ee;
      --dark: #2a1f26;
      --muted: #8a7688;
      --border: #ecdfe8;
      --gold: #d9a94c;
      --gold-light: #f2d49b;
      --green: #2e9e5b;
      --green-light: #e6f6ec;
      --red: #c0392b;
      --red-light: #fbe9e7;
      --radius: 14px;
      --shadow-sm: 0 2px 12px rgba(92, 58, 82, 0.08);
      --shadow-md: 0 10px 28px rgba(92, 58, 82, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Roboto', sans-serif; background: var(--bg-lilac); color: var(--dark); min-height: 100vh; }

    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white; padding: 1rem 1.25rem; display: flex; flex-direction: column; align-items: center;
      box-shadow: var(--shadow-md); position: sticky; top: 0; z-index: 1000; text-align: center;
    }
    header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
    header span { font-size: 0.8rem; opacity: 0.85; }
    .logout {
      background: white; color: var(--primary-purple-dark); border: none; padding: 0 0.9rem; height: 38px;
      border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      position: absolute; top: 0.8rem; right: 0.8rem;
    }

    nav { background: var(--nav-dark); display: flex; justify-content: center; overflow-x: auto; }
    nav a { flex: 0 0 auto; padding: 0.85rem 1.1rem; color: #ddd; text-decoration: none; font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }
    nav a.active { color: var(--gold-light); background: rgba(217, 169, 76, 0.12); }

    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .toolbar h2 {
      font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--primary-purple-dark);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 340px; }
    .search-wrap i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; }
    .search-wrap input {
      width: 100%; padding: 0.65rem 0.9rem 0.65rem 2.2rem; border-radius: 10px; border: 1px solid var(--border);
      font-size: 0.88rem; font-family: 'Roboto', sans-serif; background: white; color: var(--dark);
    }
    .search-wrap input:focus { outline: none; border-color: var(--primary-purple); }

    .table-wrap {
      background: white; border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    thead th {
      text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.4px;
      color: white; background: var(--nav-dark); padding: 0.8rem 1rem; white-space: nowrap;
    }
    tbody td { padding: 0.75rem 1rem; font-size: 0.88rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #faf5fb; }

    .badge {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge.pending { background: #fff2cf; color: #8a6d00; }
    .badge.accepted { background: #dbeafe; color: #1d4ed8; }
    .badge.cooking { background: #fde3c8; color: #a3550a; }
    .badge.delivered { background: var(--green-light); color: #1f6e40; }
    .badge.cancelled { background: var(--red-light); color: var(--red); }

    .btn-invoice {
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-purple-dark)); color: white;
      border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .btn-invoice:hover { opacity: 0.92; }

    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 0.9rem; }

    /* ---- Invoice Modal ---- */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(42, 31, 38, 0.55);
      z-index: 2000; align-items: flex-start; justify-content: center; padding: 2.5rem 1rem; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .invoice-sheet {
      background: white; width: 100%; max-width: 640px; border-radius: var(--radius); box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .modal-actions {
      display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.25rem;
      background: var(--bg-lilac); border-bottom: 1px solid var(--border);
    }
    .modal-actions .title { font-weight: 700; font-size: 0.9rem; color: var(--primary-purple-dark); }
    .modal-actions .actions { display: flex; gap: 0.5rem; }
    .icon-btn {
      background: white; border: 1px solid var(--border); color: var(--primary-purple-dark);
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--bg-lilac); }
    .icon-btn.close-btn { color: var(--red); }

    .invoice-body { padding: 2rem 2rem 1.5rem; }
    .invoice-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
      border-bottom: 2px solid var(--primary-purple-dark); padding-bottom: 1.2rem; margin-bottom: 1.2rem;
    }
    .invoice-brand { display: flex; align-items: center; gap: 0.8rem; }
    .invoice-brand img { height: 54px; width: 54px; border-radius: 50%; box-shadow: var(--shadow-sm); }
    .invoice-brand .name { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--primary-purple-dark); font-weight: 700; }
    .invoice-brand .tagline { font-size: 0.75rem; color: var(--muted); font-style: italic; }
    .invoice-meta { text-align: right; }
    .invoice-meta .inv-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--dark); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .invoice-meta .inv-num { font-size: 0.82rem; color: var(--muted); margin-top: 0.2rem; }

    .invoice-info { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
    .invoice-info .block { font-size: 0.85rem; }
    .invoice-info .block .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 700; margin-bottom: 0.25rem; }
    .invoice-info .block .value { color: var(--dark); font-weight: 600; }
    .invoice-info .block .value.small { font-weight: 400; color: var(--muted); font-size: 0.8rem; }

    .invoice-items { width: 100%; border-collapse: collapse; margin-bottom: 1.2rem; }
    .invoice-items th {
      text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.3px;
      color: white; background: var(--primary-purple-dark); padding: 0.55rem 0.7rem;
    }
    .invoice-items th.num, .invoice-items td.num { text-align: right; }
    .invoice-items td { padding: 0.55rem 0.7rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
    .invoice-items tr:last-child td { border-bottom: none; }

    .invoice-totals { width: 100%; max-width: 280px; margin-left: auto; font-size: 0.88rem; }
    .invoice-totals .row { display: flex; justify-content: space-between; padding: 0.35rem 0; }
    .invoice-totals .row.discount { color: var(--red); }
    .invoice-totals .row.grand {
      border-top: 2px solid var(--primary-purple-dark); margin-top: 0.4rem; padding-top: 0.6rem;
      font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--primary-purple-dark);
    }

    .invoice-instructions {
      margin-top: 1.2rem; padding: 0.7rem 0.9rem; background: var(--bg-lilac); border-radius: 8px;
      font-size: 0.82rem; color: var(--dark); border-left: 3px solid var(--gold);
    }
    .invoice-instructions .label { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 0.2rem; }

    .invoice-footer {
      text-align: center; margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px dashed var(--border);
      font-size: 0.8rem; color: var(--muted);
    }
    .invoice-footer .thanks { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--primary-purple-dark); margin-bottom: 0.3rem; }

    @media print {
      body * { visibility: hidden; }
      .invoice-sheet, .invoice-sheet * { visibility: visible; }
      .invoice-sheet { position: absolute; top: 0; left: 0; width: 100%; box-shadow: none; border-radius: 0; }
      .modal-actions { display: none; }
      .modal-overlay { position: absolute; background: none; padding: 0; }
    }

    @media (max-width: 600px) {
      .invoice-body { padding: 1.4rem 1.2rem; }
      .invoice-head { flex-direction: column; }
      .invoice-meta { text-align: left; }
      .invoice-totals { max-width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <button class="logout" onclick="logout()">Logout</button>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
  </header>

  <nav>
    <a href="admindashboard.html">Dashboard</a>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
    <a href="adminpromotions.html">Promotions</a>
    <a href="adminorderhistory.html">Order History</a>
    <a href="adminrevenue.html">Revenue</a>
    <a href="admininvoices.html" class="active">Invoices</a>
  </nav>

  <div class="container">
    <div class="toolbar">
      <h2><i class="fas fa-file-invoice"></i>&nbsp;Invoices</h2>
      <div class="search-wrap">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search by customer, table or order ID">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Date &amp; Time</th>
            <th>Customer</th>
            <th>Table</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Invoice</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="8" class="empty-state">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Invoice Modal -->
  <div class="modal-overlay" id="invoiceModal">
    <div class="invoice-sheet">
      <div class="modal-actions">
        <span class="title">Invoice Preview</span>
        <div class="actions">
          <button class="icon-btn" title="Print / Save as PDF" onclick="window.print()"><i class="fas fa-print"></i></button>
          <button class="icon-btn close-btn" title="Close" onclick="closeInvoice()"><i class="fas fa-xmark"></i></button>
        </div>
      </div>
      <div class="invoice-body" id="invoiceBody">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

  <script>
    // ---- Configuration ----
    const API_ENDPOINT = "/api/orders";
    const CAFE_LOGO = "https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png";
    const CAFE_NAME = "DELICUTE";
    const CAFE_TAGLINE = "Every Bite Tells A Story";
    // Update these with your actual cafe details for the invoice header.
    const CAFE_ADDRESS = "Royal Sunnyvale Villas, MS Shelters,Anekal near Alliance University";
    const CAFE_PHONE = "+91-8310290119";

    let allOrders = [];

    const rupee = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function statusBadgeClass(status) {
      const s = (status || "").toLowerCase();
      if (["pending", "accepted", "cooking", "delivered", "cancelled"].includes(s)) return s;
      return "pending";
    }

    function parseItems(items) {
      try {
        const arr = typeof items === "string" ? JSON.parse(items) : items;
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        return [];
      }
    }

    function itemCount(items) {
      return parseItems(items).reduce((sum, it) => sum + (Number(it.qty) || 1), 0);
    }

    // MySQL sends timestamps like "2026-08-08 12:38:46" — no "T", no
    // timezone. Handing that raw string to `new Date(...)` is ambiguous:
    // some JS engines silently treat it as UTC and shift it when displaying
    // in local time, which is what was causing wrong times to show. This
    // parses the numbers directly and builds the Date in local time, so the
    // clock-face values always match exactly what's stored in the database.
    function parseMySQLDateTime(ts) {
      if (!ts) return new Date();
      if (ts instanceof Date) return ts;
      const str = String(ts).replace("T", " ").replace("Z", "").trim();
      const [datePart, timePart = "00:00:00"] = str.split(" ");
      const [y, mo, d] = datePart.split("-").map(Number);
      const [h = 0, mi = 0, s = 0] = timePart.split(":").map(Number);
      return new Date(y, mo - 1, d, h, mi, s);
    }

    function formatDateTime(ts) {
      const d = parseMySQLDateTime(ts);
      return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) +
        ", " + d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
    }

    function renderOrdersTable(orders) {
      const tbody = document.getElementById("ordersBody");
      if (!orders.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state">No orders found.</td></tr>`;
        return;
      }
      const sorted = [...orders].sort((a, b) => parseMySQLDateTime(b.created_at) - parseMySQLDateTime(a.created_at));
      tbody.innerHTML = sorted.map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${formatDateTime(o.created_at)}</td>
          <td>${o.customer_name || "—"}</td>
          <td>${o.table_number || "—"}</td>
          <td>${itemCount(o.items)} item${itemCount(o.items) === 1 ? "" : "s"}</td>
          <td><strong>${rupee(o.total)}</strong></td>
          <td><span class="badge ${statusBadgeClass(o.status)}">${o.status || "Pending"}</span></td>
          <td><button class="btn-invoice" onclick="openInvoice(${o.id})"><i class="fas fa-file-invoice"></i> View</button></td>
        </tr>
      `).join("");
    }

    function openInvoice(orderId) {
      const o = allOrders.find(x => x.id === orderId);
      if (!o) return;
      const items = parseItems(o.items);

      const itemRows = items.map(it => `
        <tr>
          <td>${it.name || "Item"}</td>
          <td class="num">${it.qty || 1}</td>
          <td class="num">${rupee(it.price)}</td>
          <td class="num">${rupee((Number(it.price) || 0) * (Number(it.qty) || 1))}</td>
        </tr>
      `).join("");

      const instructionsBlock = o.instructions && o.instructions.trim() && o.instructions.trim() !== "."
        ? `<div class="invoice-instructions">
             <div class="label">Special Instructions</div>
             <div>${o.instructions}</div>
           </div>`
        : "";

      document.getElementById("invoiceBody").innerHTML = `
        <div class="invoice-head">
          <div class="invoice-brand">
            <img src="${CAFE_LOGO}" alt="${CAFE_NAME} logo">
            <div>
              <div class="name">${CAFE_NAME}</div>
              <div class="tagline">${CAFE_TAGLINE}</div>
            </div>
          </div>
          <div class="invoice-meta">
            <div class="inv-title">Invoice</div>
            <div class="inv-num">#${String(o.id).padStart(5, "0")}</div>
            <div class="inv-num">${formatDateTime(o.created_at)}</div>
          </div>
        </div>

        <div class="invoice-info">
          <div class="block">
            <div class="label">Billed To</div>
            <div class="value">${o.customer_name || "Guest"}</div>
            <div class="value small">Table ${o.table_number || "—"}</div>
            ${o.phone_number ? `<div class="value small">${o.phone_number}</div>` : ""}
          </div>
          <div class="block" style="text-align:right;">
            <div class="label">From</div>
            <div class="value">${CAFE_NAME}</div>
            <div class="value small">${CAFE_ADDRESS}</div>
            <div class="value small">${CAFE_PHONE}</div>
          </div>
        </div>

        <table class="invoice-items">
          <thead>
            <tr>
              <th>Item</th>
              <th class="num">Qty</th>
              <th class="num">Price</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${itemRows || `<tr><td colspan="4" style="text-align:center; color:#8a7688;">No items found</td></tr>`}
          </tbody>
        </table>

        <div class="invoice-totals">
          <div class="row"><span>Subtotal</span><span>${rupee(o.subtotal)}</span></div>
          ${Number(o.discount) > 0 ? `
          <div class="row discount">
            <span>Discount ${o.coupon_code ? "(" + o.coupon_code + ")" : ""}</span>
            <span>&minus; ${rupee(o.discount)}</span>
          </div>` : ""}
          <div class="row grand"><span>Total</span><span>${rupee(o.total)}</span></div>
        </div>

        ${instructionsBlock}

        <div class="invoice-footer">
          <div class="thanks">Thank you for dining with us!</div>
          <div>This is a system-generated invoice from ${CAFE_NAME}.</div>
        </div>
      `;

      document.getElementById("invoiceModal").classList.add("open");
    }

    function closeInvoice() {
      document.getElementById("invoiceModal").classList.remove("open");
    }

    document.getElementById("invoiceModal").addEventListener("click", (e) => {
      if (e.target.id === "invoiceModal") closeInvoice();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { renderOrdersTable(allOrders); return; }
      const filtered = allOrders.filter(o =>
        String(o.id).includes(q) ||
        (o.customer_name || "").toLowerCase().includes(q) ||
        String(o.table_number || "").toLowerCase().includes(q)
      );
      renderOrdersTable(filtered);
    });

    async function loadOrders() {
      try {
        const res = await fetch(API_ENDPOINT, { credentials: "include", cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.success === false) throw new Error(data.message || "Request failed");
        allOrders = Array.isArray(data) ? data : (data.data || data.orders || []);
        renderOrdersTable(allOrders);
      } catch (err) {
        document.getElementById("ordersBody").innerHTML =
          `<tr><td colspan="8" class="empty-state">Couldn't load orders (${err.message}).</td></tr>`;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) { window.location.href = "/admin.html"; return; }
      } catch (err) {
        window.location.href = "/admin.html";
        return;
      }
      loadOrders();
    });

    async function logout() {
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/admin.html";
    }
  </script>
</body>
</html>

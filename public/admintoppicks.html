<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Manage Top Picks</title>
<link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --primary-purple: #8e44ad;
    --primary-purple-dark: #5c3a52;
    --nav-dark: #3f2838;
    --bg-lilac: #fbf6ee;
    --dark: #2a1f26;
    --muted: #8a7688;
    --border: #ecdfe8;
    --delivered: #2e9e6b;
    --cancelled: #d64545;
    --gold: #d9a441;
    --radius: 10px;
    --shadow-sm: 0 1px 3px rgba(92, 58, 82, 0.08);
    --shadow-md: 0 4px 14px rgba(92, 58, 82, 0.12);
    --shadow-lg: 0 10px 28px rgba(92, 58, 82, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Roboto', sans-serif;
    background: var(--bg-lilac);
    color: var(--dark);
    min-height: 100vh;
    line-height: 1.5;
    overscroll-behavior: contain;
  }

  header {
    background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
    color: white;
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 0;
    z-index: 1000;
    text-align: center;
  }
  header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
  header span { font-size: 0.8rem; opacity: 0.85; }

  .logout {
    background: white;
    color: var(--primary-purple-dark);
    border: none;
    padding: 0 0.9rem;
    height: 38px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    position: absolute;
    top: 0.8rem;
    right: 0.8rem;
  }

  nav {
    background: var(--nav-dark);
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
  nav a {
    flex: 0 0 auto;
    padding: 0.85rem 1.1rem;
    color: #ddd;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.2s ease, background 0.2s ease;
  }
  nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

  .container {
    max-width: 1200px;
    margin: 1.5rem auto;
    padding: 0 1.25rem 2.5rem;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--primary-purple-dark);
    margin: 0 0 1rem;
    text-align: center;
  }

  /* ---- Stat strip ---- */
  .stat-strip {
    display: flex;
    gap: 0.9rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1 1 160px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 0.9rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .stat-card .icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: white;
    flex-shrink: 0;
  }
  .stat-card.total .icon { background: linear-gradient(135deg, var(--primary-purple), var(--primary-purple-dark)); }
  .stat-card.picked .icon { background: linear-gradient(135deg, var(--gold), #b9812c); }
  .stat-card .num { font-size: 1.3rem; font-weight: 700; color: var(--dark); line-height: 1.1; }
  .stat-card .label { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .search-bar {
    flex: 1 1 240px;
    display: flex;
    align-items: center;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    padding: 0 0.6rem;
  }
  .search-bar i { color: var(--muted); font-size: 0.9rem; }
  .search-bar input {
    border: none;
    background: transparent;
    padding: 0.7rem 0.6rem;
    font-family: 'Roboto', sans-serif;
    font-size: 0.9rem;
    width: 100%;
    outline: none;
    color: var(--dark);
  }

  .filter-pills {
    display: flex;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .filter-pill {
    padding: 0.7rem 0.95rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .filter-pill:last-child { border-right: none; }
  .filter-pill:hover { background: var(--bg-lilac); }
  .filter-pill.active { background: var(--primary-purple-dark); color: white; }

  /* ---- Grid & cards ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
  }
  .card.is-top {
    border-color: var(--gold);
    box-shadow: 0 6px 20px rgba(217, 164, 65, 0.25);
  }
  .card.is-top:hover {
    box-shadow: 0 12px 28px rgba(217, 164, 65, 0.35);
  }

  .card-img-wrap { position: relative; overflow: hidden; height: 160px; }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .card:hover .card-img-wrap img { transform: scale(1.08); }

  .top-ribbon {
    position: absolute;
    top: 10px;
    left: 10px;
    background: linear-gradient(135deg, var(--gold), #b9812c);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.3rem 0.65rem;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .top-ribbon i { font-size: 0.7rem; }

  .card-body {
    padding: 0.9rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    flex: 1;
  }
  .card-cat {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--primary-purple);
  }
  .card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--dark);
    font-weight: 700;
  }
  .card .price {
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary-purple-dark);
    margin: 0.15rem 0 0.5rem;
  }

  .btn {
    margin-top: auto;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 0.8rem;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.97); }
  .btn-top {
    background: linear-gradient(135deg, var(--primary-purple), var(--primary-purple-dark));
    color: white;
  }
  .btn-remove {
    background: white;
    color: var(--cancelled);
    border: 1.5px solid var(--cancelled);
  }
  .btn-remove:hover { background: rgba(214, 69, 69, 0.08); }

  .no-items {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .no-items i { font-size: 1.8rem; display: block; margin-bottom: 0.6rem; color: var(--border); }

  #toast {
    visibility: hidden;
    min-width: 200px;
    max-width: 300px;
    background: var(--delivered);
    color: white;
    text-align: center;
    border-radius: 10px;
    padding: 0.8rem 1rem;
    position: fixed;
    z-index: 3000;
    top: 20px;
    right: 20px;
    font-size: 0.85rem;
    box-shadow: var(--shadow-md);
  }
  #toast.show { visibility: visible; animation: slideIn 0.4s ease-out, slideOut 0.4s ease-in 2.6s forwards; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

  /* ================= MOBILE ================= */
  @media (max-width: 760px) {
    header h1 { font-size: 1.5rem; }
    header img { height: 42px; }
    .logout { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; top: 0.6rem; right: 0.6rem; }
    nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
    .container { margin: 1rem auto; padding: 0 0.9rem 1.5rem; }
    .section-title { font-size: 1.2rem; }
    .toolbar { flex-direction: column; }
    .filter-pills { width: 100%; }
    .filter-pill { flex: 1; justify-content: center; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.9rem; }
    .card-img-wrap { height: 130px; }
    .card h3 { font-size: 1rem; }
  }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .stat-card { padding: 0.75rem 0.9rem; }
    .stat-card .num { font-size: 1.1rem; }
  }
</style>
</head>
<body>
  <header>
    <button class="logout" onclick="logout()">Logout</button>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
  </header>

  <nav>
    <a href="admindashboard.html">Dashboard</a>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
    <a href="adminpromotions.html">Promotions</a>
  </nav>

  <div class="container">
    <h2 class="section-title">Manage Top Picks ⭐</h2>

    <div class="stat-strip">
      <div class="stat-card total">
        <div class="icon"><i class="fas fa-utensils"></i></div>
        <div>
          <div class="num" id="totalCount">0</div>
          <div class="label">Total Items</div>
        </div>
      </div>
      <div class="stat-card picked">
        <div class="icon"><i class="fas fa-star"></i></div>
        <div>
          <div class="num" id="pickedCount">0</div>
          <div class="label">Top Picks</div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by name or category...">
      </div>
      <div class="filter-pills" id="filterPills">
        <div class="filter-pill active" data-filter="all">All</div>
        <div class="filter-pill" data-filter="top"><i class="fas fa-star"></i> Top Picks</div>
        <div class="filter-pill" data-filter="notop">Not Picked</div>
      </div>
    </div>

    <div id="menuList" class="grid"></div>
  </div>

  <div id="toast"></div>

  <script>
    let menuData = [];
    let activeFilter = "all";

    function showToast(msg, success = true) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.background = success ? "#2e9e6b" : "#d64545";
      toast.className = "show";
      setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) { window.location.href = "/admin.html"; return; }
        await fetchMenu();
      } catch (err) {
        window.location.href = "/admin.html";
        console.error("Auth Check Error:", err);
      }
    });

    document.getElementById("searchInput").addEventListener("input", debounce(applyFilters, 200));

    document.getElementById("filterPills").addEventListener("click", (e) => {
      const pill = e.target.closest(".filter-pill");
      if (!pill) return;
      document.querySelectorAll("#filterPills .filter-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      activeFilter = pill.dataset.filter;
      applyFilters();
    });

    async function fetchMenu() {
      try {
        const res = await fetch("/api/menu");
        const data = await res.json();

        if (!data.success) {
          showToast("Failed to load menu", false);
          return;
        }

        menuData = data.data || [];
        updateStats();
        applyFilters();
      } catch (err) {
        showToast("Error loading menu items", false);
        console.error("Menu Load Error:", err);
      }
    }

    function updateStats() {
      document.getElementById("totalCount").textContent = menuData.length;
      document.getElementById("pickedCount").textContent =
        menuData.filter(item => item.is_top_pick === 1).length;
    }

    // ---- Sort: Top Picks always first, then alphabetical within each group ----
    function sortWithTopFirst(items) {
      return [...items].sort((a, b) => {
        const aTop = a.is_top_pick === 1 ? 1 : 0;
        const bTop = b.is_top_pick === 1 ? 1 : 0;
        if (aTop !== bTop) return bTop - aTop;
        return (a.name || "").localeCompare(b.name || "");
      });
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      let filtered = menuData;

      if (activeFilter === "top") {
        filtered = filtered.filter(item => item.is_top_pick === 1);
      } else if (activeFilter === "notop") {
        filtered = filtered.filter(item => item.is_top_pick !== 1);
      }

      if (query) {
        filtered = filtered.filter(item =>
          (item.name || "").toLowerCase().includes(query) ||
          (item.category || "").toLowerCase().includes(query)
        );
      }

      renderMenu(sortWithTopFirst(filtered));
    }

    function renderMenu(items) {
      const container = document.getElementById("menuList");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = `
          <div class="no-items">
            <i class="fas fa-star-half-alt"></i>
            No matching items found
          </div>`;
        return;
      }

      items.forEach(item => {
        const isTop = item.is_top_pick === 1;
        container.innerHTML += `
          <div class="card ${isTop ? "is-top" : ""}">
            <div class="card-img-wrap">
              ${isTop ? `<div class="top-ribbon"><i class="fas fa-star"></i> Top Pick</div>` : ""}
              <img src="${item.image}" alt="${item.name}" onerror="this.src='https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png'">
            </div>
            <div class="card-body">
              <span class="card-cat">${item.category || ""}</span>
              <h3>${item.name}</h3>
              <span class="price">₹${item.original_price || item.price}</span>
              <button class="btn ${isTop ? "btn-remove" : "btn-top"}" onclick="toggleTopPick(${item.id}, ${isTop})">
                <i class="fas ${isTop ? "fa-times" : "fa-star"}"></i>
                ${isTop ? "Remove from Top Picks" : "Add to Top Picks"}
              </button>
            </div>
          </div>
        `;
      });
    }

    async function toggleTopPick(id, isTop) {
      try {
        const method = isTop ? "DELETE" : "POST";
        const res = await fetch(`/api/menu/top-picks/${id}`, { method });
        const data = await res.json();

        if (data.success) {
          showToast(data.message || (isTop ? "Removed from Top Picks" : "Added to Top Picks"));
          await fetchMenu();
        } else {
          showToast("Failed: " + (data.message || "Unknown error"), false);
        }
      } catch (err) {
        showToast("Error toggling Top Pick", false);
        console.error("Toggle Error:", err);
      }
    }

    async function logout() {
      try {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.location.href = "/admin.html";
      } catch (err) {
        showToast("Error logging out", false);
        console.error("Logout Error:", err);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delicute | Users</title>
<link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto+Mono:wght@500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }

  :root {
    --graphite: #14141a;
    --graphite-2: #1a1a22;
    --panel: #1d1d26;
    --panel-2: #232330;
    --crimson: #c0392b;
    --crimson-bright: #e8543f;
    --gold: #d9a94c;
    --gold-light: #f2d49b;
    --green: #2e9e6b;
    --amber: #d9a94c;
    --red: #d64545;
    --blue: #4a90d9;
    --purple: #9b6fd9;
    --text: #e9e6ef;
    --muted: #8b889a;
    --border: #33333f;
  }

  body { font-family: 'Roboto', sans-serif; color: var(--text); background: var(--graphite); min-height: 100vh; display: flex; }
  a { color: inherit; text-decoration: none; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content { padding: 1.4rem; flex: 1; display: flex; }

  .coming-soon-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .coming-soon-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3.2rem 2.5rem;
    max-width: 460px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .coming-soon-panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--crimson-bright), var(--gold), var(--purple));
    opacity: 0.75;
  }

  .icon-circle {
    width: 68px; height: 68px;
    border-radius: 50%;
    margin: 0 auto 1.4rem;
    display: flex; align-items: center; justify-content: center;
    background: rgba(217,169,76,0.12);
    border: 1px solid rgba(217,169,76,0.3);
  }
  .icon-circle svg { width: 30px; height: 30px; color: var(--gold-light); }

  .badge-soon {
    display: inline-block;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    background: rgba(217,169,76,0.15);
    border: 1px solid rgba(217,169,76,0.4);
    color: var(--gold-light);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .coming-soon-title {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 1.6rem;
    margin-bottom: 0.6rem;
    background: linear-gradient(90deg, var(--text), var(--gold-light));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  .coming-soon-sub {
    font-size: 0.92rem;
    color: var(--muted);
    line-height: 1.55;
    max-width: 360px;
    margin: 0 auto;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 1.6rem;
  }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold);
    opacity: 0.35;
    animation: dotBounce 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-4px); }
  }

  @media (max-width: 560px) {
    .content { padding: 1rem; }
    .coming-soon-panel { padding: 2.4rem 1.6rem; }
  }
</style>
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="main">
  <div id="header-placeholder"></div>

  <div class="content">
    <div class="coming-soon-wrap">
      <div class="coming-soon-panel">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </div>
        <div class="badge-soon">Coming Soon</div>
        <div class="coming-soon-title">Users</div>
        <div class="coming-soon-sub">
          Customer account management is currently in the works. Check back soon — this section will let you view, search, and manage all registered users.
        </div>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
</div>

<script>
  function loadComponent(url, placeholderId) {
    return fetch(url)
      .then(r => r.text())
      .then(html => {
        const el = document.getElementById(placeholderId);
        el.innerHTML = html;
        el.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          old.replaceWith(s);
        });
      });
  }

  window.PAGE_TITLE = "Users";
  window.PAGE_SUB = "Customer account management";
  window.onRefresh = null;

  Promise.all([
    loadComponent('superadminsidedashboard.html', 'sidebar-placeholder'),
    loadComponent('superadminheader.html', 'header-placeholder')
  ]);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Delicute | Super Admin</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto+Mono:wght@500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }

    :root {
      --graphite: #14141a;
      --graphite-2: #1d1d26;
      --panel: #202029;
      --crimson: #c0392b;
      --crimson-bright: #e8543f;
      --gold: #d9a94c;
      --gold-light: #f2d49b;
      --text: #e9e6ef;
      --muted: #8b889a;
      --border: #33333f;
    }

    body {
      font-family: 'Roboto', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--graphite);
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(217, 169, 76, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217, 169, 76, 0.045) 1px, transparent 1px);
      background-size: 42px 42px;
      background-position: center;
      mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,0.9), transparent 75%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,0.9), transparent 75%);
    }

    .bg-glow {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(circle at 50% 20%, rgba(192, 57, 43, 0.16), transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(217, 169, 76, 0.10), transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(142, 68, 173, 0.10), transparent 50%);
      animation: glowPulse 10s ease-in-out infinite;
    }
    @keyframes glowPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }

    .scanline {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    }

    .page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2.5rem 1.25rem 1.5rem; position: relative; z-index: 1;
    }

    .container {
      position: relative; z-index: 1;
      background: rgba(32, 32, 41, 0.85);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      padding: 2.2rem 2rem 1.9rem; border-radius: 16px;
      border: 1px solid rgba(217, 169, 76, 0.22);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.03) inset;
      width: 100%; max-width: 370px; text-align: center;
      opacity: 0; transform: translateY(24px);
      animation: cardIn 0.7s ease-out forwards;
      overflow: hidden;
    }

    .container::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--crimson-bright), var(--gold), transparent);
      opacity: 0.8;
    }

    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .logo-section { margin-bottom: 1.3rem; position: relative; z-index: 1; }

    .logo {
      width: 62px; height: 62px; object-fit: contain; display: block; margin: 0 auto 0.6rem;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(217, 169, 76, 0.35), 0 6px 16px rgba(0,0,0,0.4);
      opacity: 0; transform: scale(0.85);
      animation: fadeInScale 0.7s ease-out 0.15s forwards;
    }

    .brand-name {
      font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.4rem;
      letter-spacing: 1px; color: var(--text);
      opacity: 0; transform: translateY(14px);
      animation: fadeInUp 0.6s ease-out 0.3s forwards;
    }

    .tagline {
      font-family: 'Roboto Mono', monospace; font-size: 0.68rem; font-weight: 500;
      letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
      margin-top: 0.3rem; opacity: 0; transform: translateY(14px);
      animation: fadeInUp 0.6s ease-out 0.42s forwards;
    }

    .portal-label {
      display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.75rem;
      font-family: 'Roboto Mono', monospace; font-weight: 600; font-size: 0.64rem;
      letter-spacing: 2px; text-transform: uppercase; color: #fff;
      background: linear-gradient(45deg, var(--crimson), #8e2419);
      padding: 0.34rem 0.85rem; border-radius: 5px;
      box-shadow: 0 4px 14px rgba(192, 57, 43, 0.35);
      opacity: 0; animation: fadeInUp 0.6s ease-out 0.54s forwards;
    }

    .portal-label .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 0 rgba(255,255,255,0.6);
      animation: dotPulse 1.6s ease-out infinite;
    }
    @keyframes dotPulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.55); }
      70%  { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }

    .form {
      display: flex; flex-direction: column; position: relative; z-index: 1;
      margin-top: 1.4rem; opacity: 0; transform: translateY(16px);
      animation: fadeInUp 0.6s ease-out 0.66s forwards;
    }

    .field { position: relative; margin: 0.45rem 0; text-align: left; }

    .field label {
      display: block; font-family: 'Roboto Mono', monospace; font-size: 0.68rem;
      font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      color: var(--gold-light); margin-bottom: 0.32rem; padding-left: 0.15rem;
    }

    .form input {
      width: 100%; padding: 0.72rem 0.95rem; border: 1.5px solid var(--border);
      border-radius: 8px; font-family: 'Roboto Mono', monospace; font-size: 0.9rem;
      background: rgba(20, 20, 26, 0.6); color: var(--text);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .form input::placeholder { color: #5c5a68; }

    .form input:focus {
      outline: none; border-color: var(--crimson-bright);
      background: rgba(20, 20, 26, 0.9);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.18);
    }

    .form-options {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0.35rem 0 0.4rem;
    }

    .otp-hint {
      font-family: 'Roboto Mono', monospace; font-size: 0.68rem;
      color: var(--muted); letter-spacing: 0.3px;
    }

    .forgot-link {
      font-size: 0.78rem; font-weight: 600; color: var(--gold);
      text-decoration: none; transition: color 0.2s ease;
    }
    .forgot-link:hover { color: var(--gold-light); text-decoration: underline; }

    .submit-btn {
      margin-top: 0.85rem; padding: 0.78rem; border: none; border-radius: 8px;
      background: linear-gradient(45deg, var(--crimson), #8e2419); color: #fff;
      font-family: 'Roboto Mono', monospace; font-weight: 600; font-size: 0.85rem;
      letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      box-shadow: 0 6px 16px rgba(192, 57, 43, 0.3);
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 9px 22px rgba(192, 57, 43, 0.42);
      background: linear-gradient(45deg, var(--crimson-bright), var(--crimson));
    }

    .submit-btn:active:not(:disabled) { transform: translateY(0); }

    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none; width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
      border-radius: 50%; vertical-align: -3px; margin-right: 0.5rem;
      animation: spin 0.7s linear infinite;
    }

    .submit-btn.loading .spinner { display: inline-block; }
    .submit-btn.loading .btn-text { opacity: 0.9; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInScale { to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    .restricted-notice {
      position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 0.55rem;
      margin-top: 1.25rem; padding: 0.75rem 0.9rem; border-radius: 10px;
      background: rgba(192, 57, 43, 0.08); border: 1px solid rgba(192, 57, 43, 0.3);
      text-align: left; opacity: 0; transform: translateY(14px);
      animation: fadeInUp 0.6s ease-out 0.8s forwards;
    }

    .restricted-notice .lock-icon {
      flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; color: var(--crimson-bright);
    }

    .restricted-notice span {
      font-family: 'Roboto Mono', monospace; font-size: 0.72rem; line-height: 1.5;
      font-weight: 500; color: #d8b8b0; letter-spacing: 0.1px;
    }

    .site-footer {
      position: relative; z-index: 1; text-align: center; padding: 1.2rem 1rem 1.5rem;
      font-family: 'Roboto Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.5px;
    }

    #toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 2000;
      display: flex; flex-direction: column; gap: 0.6rem; max-width: 90vw;
    }

    .toast {
      display: flex; align-items: center; gap: 0.65rem; min-width: 260px; max-width: 340px;
      background: var(--panel); border-radius: 10px; padding: 0.85rem 1.05rem;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4); border-left: 4px solid var(--crimson);
      font-family: 'Roboto', sans-serif; font-size: 0.9rem; font-weight: 500; color: var(--text);
      opacity: 0; transform: translateX(40px); animation: toastIn 0.4s ease-out forwards;
    }

    .toast.success { border-left-color: #2e9e6b; }
    .toast.error   { border-left-color: #d64545; }

    .toast .icon {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 800; color: #fff;
    }
    .toast.success .icon { background: #2e9e6b; }
    .toast.error .icon { background: #d64545; }

    .toast.hide { animation: toastOut 0.35s ease-in forwards; }

    @keyframes toastIn { to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

    @media (min-width: 1024px) {
      .container { max-width: 390px; padding: 2.5rem 2.2rem 2.2rem; }
      .logo { width: 70px; height: 70px; }
      .brand-name { font-size: 1.55rem; }
    }

    @media (max-width: 600px) {
      .page { padding: 2rem 1rem 1rem; }
      .container { padding: 1.9rem 1.4rem 1.7rem; border-radius: 14px; max-width: 340px; }
      .logo { width: 54px; height: 54px; }
      .brand-name { font-size: 1.2rem; }
      .form input { font-size: 0.85rem; padding: 0.68rem 0.85rem; }
      .submit-btn { font-size: 0.8rem; padding: 0.72rem; }
      #toast-container { top: auto; bottom: 16px; right: 16px; left: 16px; max-width: none; }
      .toast { min-width: 0; max-width: none; width: 100%; }
      .restricted-notice span { font-size: 0.68rem; }
      .site-footer { font-size: 0.65rem; padding: 1.1rem 1rem 1.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="scanline"></div>

  <div class="page">
    <div class="container">
      <div class="logo-section">
        <img class="logo" src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="Delicute Logo" />
        <div class="brand-name">DELICUTE</div>
        <div class="tagline">Root Access Console</div>
        <div class="portal-label"><span class="dot"></span> Super Admin</div>
      </div>

      <form id="loginForm" class="form" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="dev@delicute.com" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••••" required autocomplete="current-password" />
        </div>
        <div class="field" id="otpField" style="display:none;">
          <label for="loginOtp">Verification Code</label>
          <input type="text" id="loginOtp" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        </div>
        <div class="form-options">
          <span class="otp-hint">Two-factor protected</span>
          <a href="#" class="forgot-link" id="forgotLink">Reset access</a>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner"></span><span class="btn-text">Authenticate</span>
        </button>
      </form>

      <div class="restricted-notice">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="10.5" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 10.5V7.5C8 5.29 9.79 3.5 12 3.5C14.21 3.5 16 5.29 16 7.5V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
        </svg>
        <span>Developer-only console. Every login is logged with IP and timestamp. Unauthorized access attempts will be reported.</span>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    DELICUTE &middot; SUPERADMIN &middot; BUILD 2026.08
  </footer>

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
    const LOGIN_ENDPOINT = "/api/superadmin/auth/login";
    const DASHBOARD_REDIRECT = "/superadmindashboard.html";

    function showToast(message, type = 'success', duration = 3500) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span class="icon">${type === 'success' ? '✓' : '!'}</span><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('hide');
        toast.addEventListener('animationend', () => toast.remove(), { once: true });
      }, duration);
    }

    const forgotLink = document.getElementById('forgotLink');
    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Contact the platform owner directly to reset super admin access.', 'error');
    });

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const otpField = document.getElementById('otpField');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const otp = document.getElementById('loginOtp').value.trim();

      if (!email || !password) {
        showToast('Please fill in both fields.', 'error');
        return;
      }
      if (otpField.style.display !== 'none' && !otp) {
        showToast('Enter the verification code sent to you.', 'error');
        return;
      }

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const res = await fetch(LOGIN_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, otp: otp || undefined }),
          credentials: 'include'
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.otpRequired) {
            otpField.style.display = 'block';
            showToast('Verification code required. Check your email.', 'error');
          } else {
            showToast('Access granted. Redirecting…', 'success');
            setTimeout(() => { window.location.href = DASHBOARD_REDIRECT; }, 1000);
          }
        } else {
          showToast(data.message || 'Invalid credentials.', 'error');
        }
      } catch (err) {
        showToast('Server unreachable. Please try again.', 'error');
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

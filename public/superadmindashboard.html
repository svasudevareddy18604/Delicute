<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delicute | Super Admin Console</title>
<link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto+Mono:wght@500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }

  :root {
    --graphite: #14141a;
    --graphite-2: #1a1a22;
    --panel: #1d1d26;
    --panel-2: #232330;
    --crimson: #c0392b;
    --crimson-bright: #e8543f;
    --gold: #d9a94c;
    --gold-light: #f2d49b;
    --green: #2e9e6b;
    --amber: #d9a94c;
    --red: #d64545;
    --text: #e9e6ef;
    --muted: #8b889a;
    --border: #33333f;
  }

  body {
    font-family: 'Roboto', sans-serif;
    color: var(--text);
    background: var(--graphite);
    min-height: 100vh;
    display: flex;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .content { padding: 1.4rem; flex: 1; }

  /* ---------- Stat cards ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.9rem;
    margin-bottom: 1.3rem;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--crimson-bright), var(--gold));
    opacity: 0.7;
  }
  .stat-label { font-family: 'Roboto Mono', monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .stat-value { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.7rem; margin-top: 0.35rem; }
  .stat-delta { font-size: 0.72rem; margin-top: 0.3rem; color: var(--green); font-weight: 600; }
  .stat-delta.down { color: var(--red); }

  /* ---------- Panels / cards ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.1rem 1.2rem;
    margin-bottom: 1.1rem;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.9rem; flex-wrap: wrap; gap: 0.6rem;
  }
  .panel-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.02rem; }

  .btn {
    padding: 0.48rem 0.9rem;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 0.35rem;
  }
  .btn:hover { border-color: rgba(217,169,76,0.4); }
  .btn.small { padding: 0.32rem 0.65rem; font-size: 0.7rem; }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th {
    text-align: left;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    padding: 0.55rem 0.7rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 0.62rem 0.7rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .empty-row td { text-align: center; color: var(--muted); padding: 1.6rem; font-family: 'Roboto Mono', monospace; font-size: 0.78rem; }

  .badge {
    display: inline-block; padding: 0.2rem 0.55rem; border-radius: 5px;
    font-family: 'Roboto Mono', monospace; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.4px;
  }
  .badge.green { background: rgba(46,158,107,0.15); color: #7fd9ac; }
  .badge.amber { background: rgba(217,169,76,0.15); color: var(--gold-light); }
  .badge.red { background: rgba(214,69,69,0.15); color: #f2a3a3; }
  .badge.gray { background: rgba(139,136,154,0.15); color: var(--muted); }

  /* ---------- Toast ---------- */
  #toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 2000;
    display: flex; flex-direction: column; gap: 0.6rem; max-width: 90vw;
  }
  .toast {
    display: flex; align-items: center; gap: 0.65rem; min-width: 260px; max-width: 340px;
    background: var(--panel); border-radius: 10px; padding: 0.85rem 1.05rem;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4); border-left: 4px solid var(--crimson);
    font-size: 0.9rem; font-weight: 500; color: var(--text);
    opacity: 0; transform: translateX(40px); animation: toastIn 0.4s ease-out forwards;
  }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  .toast .icon {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: #fff;
  }
  .toast.success .icon { background: var(--green); }
  .toast.error .icon { background: var(--red); }
  .toast.hide { animation: toastOut 0.35s ease-in forwards; }
  @keyframes toastIn { to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

  /* ---------- Responsive ---------- */
  @media (max-width: 1080px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .stat-grid { grid-template-columns: 1fr; }
    .content { padding: 1rem; }
    .panel-head { flex-direction: column; align-items: flex-start; }
    #toast-container { top: auto; bottom: 16px; right: 16px; left: 16px; max-width: none; }
    .toast { min-width: 0; max-width: none; width: 100%; }
  }
</style>
</head>
<body>

<!-- Sidebar gets injected here -->
<div id="sidebar-placeholder"></div>

<div class="main">
  <!-- Header gets injected here -->
  <div id="header-placeholder"></div>

  <div class="content">

    <!-- OVERVIEW -->
    <section id="section-overview">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Orders Today</div><div class="stat-value" id="statOrdersToday">–</div><div class="stat-delta" id="statOrdersDelta">–</div></div>
        <div class="stat-card"><div class="stat-label">Revenue Today</div><div class="stat-value" id="statRevenueToday">–</div><div class="stat-delta" id="statRevenueDelta">–</div></div>
        <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="statUsers">–</div><div class="stat-delta" id="statUsersDelta">–</div></div>
        <div class="stat-card"><div class="stat-label">Active Coupons</div><div class="stat-value" id="statCoupons">–</div><div class="stat-delta" id="statCouponsDelta">–</div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Recent Orders</div>
          <a class="btn small" href="superadminorders.html">View all →</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
            <tbody id="recentOrdersBody"><tr class="empty-row"><td colspan="6">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>

  </div>
</div>

<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<script>
  // ============ Config ============
  const API_BASE = "/api/superadmin";
  const ENDPOINTS = {
    stats: `${API_BASE}/dashboard/stats`
  };
  const LOGIN_PAGE = "/superadminlogin.html";

  // ============ Toast (shared globally so header.html can use it) ============
  window.showToast = function showToast(message, type = 'success', duration = 3200) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span class="icon">${type === 'success' ? '✓' : '!'}</span><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('hide');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
    }, duration);
  };

  // ============ Fetch helper ============
  async function api(url, options = {}) {
    const res = await fetch(url, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (res.status === 401) {
      window.location.href = LOGIN_PAGE;
      return null;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  const fmtMoney = (n) => `₹${Number(n || 0).toLocaleString('en-IN')}`;
  const fmtDate = (d) => d ? new Date(d).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function statusBadge(status) {
    const map = { Delivered: 'green', Accepted: 'amber', Cooking: 'amber', Pending: 'gray', Cancelled: 'red' };
    const cls = map[status] || 'gray';
    return `<span class="badge ${cls}">${escapeHtml(status || 'unknown')}</span>`;
  }

  // ============ Overview loader ============
  async function loadOverview() {
    try {
      const data = await api(ENDPOINTS.stats);
      if (!data) return;
      document.getElementById('statOrdersToday').textContent = data.ordersToday ?? '0';
      document.getElementById('statRevenueToday').textContent = fmtMoney(data.revenueToday);
      document.getElementById('statUsers').textContent = data.totalUsers ?? '0';
      document.getElementById('statCoupons').textContent = data.activeCoupons ?? '0';

      const deltas = [
        ['statOrdersDelta', data.ordersDeltaPct],
        ['statRevenueDelta', data.revenueDeltaPct],
        ['statUsersDelta', data.usersDeltaPct],
        ['statCouponsDelta', data.couponsDeltaPct]
      ];
      deltas.forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (val === undefined || val === null) { el.textContent = '—'; return; }
        const up = val >= 0;
        el.textContent = `${up ? '▲' : '▼'} ${Math.abs(val)}% vs yesterday`;
        el.classList.toggle('down', !up);
      });

      const body = document.getElementById('recentOrdersBody');
      const rows = (data.recentOrders || []);
      body.innerHTML = rows.length ? rows.map(o => `
        <tr>
          <td>#${escapeHtml(o.id)}</td>
          <td>${escapeHtml(o.customerName)}</td>
          <td>${o.itemCount ?? '—'}</td>
          <td>${fmtMoney(o.total)}</td>
          <td>${statusBadge(o.status)}</td>
          <td>${fmtDate(o.createdAt)}</td>
        </tr>`).join('') : `<tr class="empty-row"><td colspan="6">No orders yet.</td></tr>`;
    } catch (e) {
      showToast('Could not load overview stats.', 'error');
    }
  }

  // ============ Load sidebar + header components, then init page ============
  function loadComponent(url, placeholderId) {
    return fetch(url)
      .then(r => r.text())
      .then(html => {
        const el = document.getElementById(placeholderId);
        el.innerHTML = html;
        // re-run inline scripts (innerHTML doesn't execute them)
        el.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          old.replaceWith(s);
        });
      });
  }

  // Page-level hooks the header component reads
  window.PAGE_TITLE = "Overview";
  window.PAGE_SUB = "Real-time snapshot of Delicute";
  window.onRefresh = loadOverview;

  Promise.all([
  loadComponent('superadminsidedashboard.html', 'sidebar-placeholder'),
  loadComponent('superadminheader.html', 'header-placeholder')
]).then(() => {
  loadOverview();
});
</script>
</body>
</html>

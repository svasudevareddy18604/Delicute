<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delicute | Tables</title>
<link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto+Mono:wght@500;600&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }

  :root {
    --graphite: #14141a;
    --graphite-2: #1a1a22;
    --panel: #1d1d26;
    --panel-2: #232330;
    --crimson: #c0392b;
    --crimson-bright: #e8543f;
    --gold: #d9a94c;
    --gold-light: #f2d49b;
    --green: #2e9e6b;
    --amber: #d9a94c;
    --red: #d64545;
    --blue: #4a90d9;
    --purple: #9b6fd9;
    --text: #e9e6ef;
    --muted: #8b889a;
    --border: #33333f;
  }

  body { font-family: 'Roboto', sans-serif; color: var(--text); background: var(--graphite); min-height: 100vh; display: flex; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .content { padding: 1.4rem; flex: 1; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem 1.3rem;
    margin-bottom: 1.2rem;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--purple), var(--blue));
    opacity: 0.75;
  }

  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.7rem; }
  .panel-title-wrap { display: flex; align-items: center; gap: 0.6rem; }
  .panel-icon {
    width: 36px; height: 36px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(155,111,217,0.15); color: #c9aef2;
    flex-shrink: 0;
  }
  .panel-icon svg { width: 18px; height: 18px; }
  .panel-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.05rem; }
  .panel-count { font-family: 'Roboto Mono', monospace; font-size: 0.65rem; color: var(--muted); }
  .panel-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }

  .panel-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  input.search, input.text-input, select.select {
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--graphite-2);
    color: var(--text);
    font-size: 0.8rem;
    font-family: 'Roboto Mono', monospace;
  }
  input.search:focus, input.text-input:focus, select.select:focus { outline: none; border-color: rgba(217,169,76,0.5); }

  .btn {
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 0.35rem;
    transition: all 0.15s ease;
  }
  .btn:hover { border-color: rgba(217,169,76,0.4); }
  .btn.primary {
    background: linear-gradient(135deg, var(--purple), #6a4a99);
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 14px rgba(155,111,217,0.3);
  }
  .btn.primary:hover { background: linear-gradient(135deg, #a97fe0, var(--purple)); }
  .btn.danger { color: #f2a3a3; }
  .btn.danger:hover { border-color: rgba(214,69,69,0.4); }
  .btn.small { padding: 0.34rem 0.7rem; font-size: 0.7rem; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- QR base url panel ---------- */
  .qr-row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .qr-row input.text-input { flex: 1; min-width: 220px; }

  /* ---------- Table ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  thead th {
    text-align: left; font-family: 'Roboto Mono', monospace; font-size: 0.62rem;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
    padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 0.68rem 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr.row-new { background: rgba(155,111,217,0.12); }
  .empty-row td { text-align: center; color: var(--muted); padding: 1.8rem; font-family: 'Roboto Mono', monospace; font-size: 0.78rem; }

  .tnum-cell { font-family: 'Roboto Mono', monospace; font-weight: 700; color: var(--gold-light); }
  .mono { font-family: 'Roboto Mono', monospace; color: var(--muted); font-size: 0.78rem; }

  .badge {
    display: inline-block; padding: 0.22rem 0.6rem; border-radius: 6px;
    font-family: 'Roboto Mono', monospace; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.4px;
  }
  .badge.green { background: rgba(46,158,107,0.15); color: #7fd9ac; }
  .badge.red { background: rgba(214,69,69,0.15); color: #f2a3a3; }

  .row-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center; padding: 1rem;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.4rem; width: 100%; max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-box h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; margin-bottom: 1rem; }
  .form-group { margin-bottom: 0.9rem; }
  .form-group label {
    display: block; font-family: 'Roboto Mono', monospace; font-size: 0.65rem;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 0.4rem;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 0.6rem 0.8rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--graphite-2); color: var(--text);
    font-size: 0.85rem; font-family: 'Roboto Mono', monospace;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: rgba(217,169,76,0.5); }
  .modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem; }

  /* ---------- QR preview modal ---------- */
  .qr-modal-box { text-align: center; max-width: 340px; }
  .qr-modal-box img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 10px; margin: 0.8rem 0; }
  .qr-modal-box .qr-table-num { font-family: 'Roboto Mono', monospace; color: var(--gold-light); font-weight: 700; font-size: 0.9rem; }
  .qr-modal-box .qr-link { font-family: 'Roboto Mono', monospace; font-size: 0.65rem; color: var(--muted); word-break: break-all; margin-top: 0.4rem; }

  /* ---------- Toast ---------- */
  #toast-container { position: fixed; top: 80px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 0.6rem; max-width: 90vw; }
  .toast {
    display: flex; align-items: center; gap: 0.65rem; min-width: 260px; max-width: 340px;
    background: var(--panel); border-radius: 10px; padding: 0.85rem 1.05rem;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4); border-left: 4px solid var(--crimson);
    font-size: 0.9rem; font-weight: 500; color: var(--text);
    opacity: 0; transform: translateX(40px); animation: toastIn 0.4s ease-out forwards;
  }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  .toast .icon {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: #fff;
  }
  .toast.success .icon { background: var(--green); }
  .toast.error .icon { background: var(--red); }
  .toast.hide { animation: toastOut 0.35s ease-in forwards; }
  @keyframes toastIn { to { opacity: 1; transform: translateX(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

  @media (max-width: 560px) {
    .content { padding: 1rem; }
    .panel-head { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="sidebar-placeholder"></div>

<div class="main">
  <div id="header-placeholder"></div>

  <div class="content">

    <!-- QR BASE URL -->
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title-wrap">
          <div class="panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20v.01"/></svg>
          </div>
          <div>
            <div class="panel-title">Ordering Page URL</div>
            <div class="panel-sub">The base URL every table's QR code points to</div>
          </div>
        </div>
      </div>
      <div class="qr-row">
        <input class="text-input" id="baseUrlInput" placeholder="https://delicute.example.com/order" />
        <button class="btn primary" id="saveBaseUrlBtn">Save URL</button>
      </div>
    </div>

    <!-- TABLES -->
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title-wrap">
          <div class="panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
          </div>
          <div>
            <div class="panel-title">Tables</div>
            <div class="panel-count" id="tablesCount">— tables</div>
          </div>
        </div>
        <div class="panel-actions">
          <input class="search" id="tableSearch" placeholder="Search number / location…" />
          <select class="select" id="statusFilter">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <button class="btn primary" id="addTableBtn">+ Add Table</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Table #</th><th>Capacity</th><th>Location</th><th>Status</th><th>Updated</th><th></th></tr>
          </thead>
          <tbody id="tablesBody"><tr class="empty-row"><td colspan="6">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- ADD/EDIT TABLE MODAL -->
<div class="modal-overlay" id="tableModal">
  <div class="modal-box">
    <h3 id="tableModalTitle">Add Table</h3>
    <input type="hidden" id="tableId" />
    <div class="form-group"><label>Table Number</label><input type="text" id="tableNumber" placeholder="e.g. 12" /></div>
    <div class="form-group"><label>Capacity</label><input type="number" id="tableCapacity" placeholder="e.g. 4" min="1" /></div>
    <div class="form-group"><label>Location</label><input type="text" id="tableLocation" placeholder="e.g. Patio, Indoor, 1st Floor" /></div>
    <div class="form-group">
      <label>Status</label>
      <select id="tableStatus">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelTableModal">Cancel</button>
      <button class="btn primary" id="saveTableBtn">Save Table</button>
    </div>
  </div>
</div>

<!-- QR PREVIEW MODAL -->
<div class="modal-overlay" id="qrModal">
  <div class="modal-box qr-modal-box">
    <h3>Table QR Code</h3>
    <div class="qr-table-num" id="qrTableLabel">—</div>
    <img id="qrImage" src="" alt="QR Code" />
    <div class="qr-link" id="qrLink">—</div>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn" id="closeQrModal">Close</button>
      <a class="btn primary" id="downloadQrBtn" download="table-qr.png">Download</a>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<script>
  // ============ Config ============
  const API_BASE = "/api/superadmin/tables";
  const LOGIN_PAGE = "/superadminlogin.html";

  let currentTables = [];
  let knownIds = new Set();
  let firstLoad = true;
  let savedBaseUrl = "";

  // ============ Toast ============
  window.showToast = function showToast(message, type = 'success', duration = 3200) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span class="icon">${type === 'success' ? '✓' : '!'}</span><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('hide');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
    }, duration);
  };

  // ============ Fetch helper ============
  async function api(url, options = {}) {
    const res = await fetch(url, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      ...options
    });
    if (res.status === 401) {
      window.location.href = LOGIN_PAGE;
      return null;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) throw new Error(data.message || 'Request failed');
    return data;
  }

  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtDate = (d) => d ? new Date(d).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';

  // ============ QR base URL ============
  async function loadBaseUrl() {
    try {
      const data = await api(`${API_BASE}/qr-settings`);
      if (!data) return;
      savedBaseUrl = data.settings.base_url || "";
      document.getElementById('baseUrlInput').value = savedBaseUrl;
    } catch (e) {
      window.showToast(e.message || 'Failed to load QR settings.', 'error');
    }
  }

  document.getElementById('saveBaseUrlBtn').addEventListener('click', async () => {
    const value = document.getElementById('baseUrlInput').value.trim();
    if (!value) { window.showToast('Enter a valid URL.', 'error'); return; }
    try {
      await api(`${API_BASE}/qr-settings`, { method: 'PUT', body: JSON.stringify({ base_url: value }) });
      savedBaseUrl = value;
      window.showToast('Ordering page URL saved.', 'success');
    } catch (e) {
      window.showToast(e.message || 'Failed to save URL.', 'error');
    }
  });

  // ============ Load tables ============
  async function loadTables(showLoadingState = false) {
    const body = document.getElementById('tablesBody');
    if (showLoadingState) body.innerHTML = `<tr class="empty-row"><td colspan="6">Loading…</td></tr>`;
    try {
      const q = document.getElementById('tableSearch').value.trim();
      const status = document.getElementById('statusFilter').value;
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (status) params.set('status', status);

      const data = await api(`${API_BASE}?${params.toString()}`);
      if (!data) return;
      const rows = data.tables || [];
      currentTables = rows;
      document.getElementById('tablesCount').textContent = `${rows.length} table${rows.length === 1 ? '' : 's'}`;

      if (!rows.length) {
        body.innerHTML = `<tr class="empty-row"><td colspan="6">No tables found.</td></tr>`;
        knownIds = new Set();
        firstLoad = false;
        return;
      }

      body.innerHTML = rows.map(t => {
        const isNew = !firstLoad && !knownIds.has(t.id);
        return `
        <tr class="${isNew ? 'row-new' : ''}">
          <td class="tnum-cell">${escapeHtml(t.table_number)}</td>
          <td>${t.capacity ?? '—'}</td>
          <td>${escapeHtml(t.location || '—')}</td>
          <td><span class="badge ${t.status === 'active' ? 'green' : 'red'}">${t.status === 'active' ? 'Active' : 'Inactive'}</span></td>
          <td class="mono">${fmtDate(t.updated_at || t.created_at)}</td>
          <td>
            <div class="row-actions">
              <button class="btn small" data-qr="${t.id}">QR</button>
              <button class="btn small" data-edit="${t.id}">Edit</button>
              <button class="btn small ${t.status === 'active' ? 'danger' : ''}" data-toggle="${t.id}" data-status="${t.status}">
                ${t.status === 'active' ? 'Deactivate' : 'Activate'}
              </button>
              <button class="btn small danger" data-delete="${t.id}">Delete</button>
            </div>
          </td>
        </tr>`;
      }).join('');

      knownIds = new Set(rows.map(t => t.id));
      firstLoad = false;

      setTimeout(() => {
        document.querySelectorAll('#tablesBody tr.row-new').forEach(tr => tr.classList.remove('row-new'));
      }, 1200);

    } catch (e) {
      body.innerHTML = `<tr class="empty-row"><td colspan="6">Failed to load tables.</td></tr>`;
      window.showToast(e.message || 'Failed to load tables.', 'error');
    }
  }

  let searchTimer;
  document.getElementById('tableSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadTables(false), 350);
  });
  document.getElementById('statusFilter').addEventListener('change', () => loadTables(true));

  // ============ Add / Edit modal ============
  const tableModal = document.getElementById('tableModal');

  function openAddModal() {
    document.getElementById('tableModalTitle').textContent = 'Add Table';
    document.getElementById('tableId').value = '';
    document.getElementById('tableNumber').value = '';
    document.getElementById('tableCapacity').value = '';
    document.getElementById('tableLocation').value = '';
    document.getElementById('tableStatus').value = 'active';
    tableModal.classList.add('show');
  }

  function openEditModal(table) {
    document.getElementById('tableModalTitle').textContent = `Edit Table ${table.table_number}`;
    document.getElementById('tableId').value = table.id;
    document.getElementById('tableNumber').value = table.table_number;
    document.getElementById('tableCapacity').value = table.capacity ?? '';
    document.getElementById('tableLocation').value = table.location ?? '';
    document.getElementById('tableStatus').value = table.status;
    tableModal.classList.add('show');
  }

  document.getElementById('addTableBtn').addEventListener('click', openAddModal);
  document.getElementById('cancelTableModal').addEventListener('click', () => tableModal.classList.remove('show'));

  document.getElementById('saveTableBtn').addEventListener('click', async () => {
    const id = document.getElementById('tableId').value;
    const table_number = document.getElementById('tableNumber').value.trim();
    const capacity = document.getElementById('tableCapacity').value;
    const location = document.getElementById('tableLocation').value.trim();
    const status = document.getElementById('tableStatus').value;

    if (!table_number) { window.showToast('Table number is required.', 'error'); return; }

    const payload = { table_number, capacity: capacity ? Number(capacity) : null, location, status };

    try {
      if (id) {
        await api(`${API_BASE}/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        window.showToast('Table updated.', 'success');
      } else {
        await api(API_BASE, { method: 'POST', body: JSON.stringify(payload) });
        window.showToast('Table created.', 'success');
      }
      tableModal.classList.remove('show');
      loadTables(false);
    } catch (e) {
      window.showToast(e.message || 'Failed to save table.', 'error');
    }
  });

  tableModal.addEventListener('click', (e) => { if (e.target === tableModal) tableModal.classList.remove('show'); });

  // ============ QR preview modal ============
  const qrModal = document.getElementById('qrModal');

  function openQrModal(table) {
    if (!savedBaseUrl) {
      window.showToast('Set the ordering page URL above first.', 'error');
      return;
    }
    const separator = savedBaseUrl.includes('?') ? '&' : '?';
    const link = `${savedBaseUrl}${separator}table=${encodeURIComponent(table.table_number)}`;
    const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(link)}`;

    document.getElementById('qrTableLabel').textContent = `Table ${table.table_number}`;
    document.getElementById('qrImage').src = qrImgUrl;
    document.getElementById('qrLink').textContent = link;
    document.getElementById('downloadQrBtn').href = qrImgUrl;
    document.getElementById('downloadQrBtn').download = `table-${table.table_number}-qr.png`;
    qrModal.classList.add('show');
  }

  document.getElementById('closeQrModal').addEventListener('click', () => qrModal.classList.remove('show'));
  qrModal.addEventListener('click', (e) => { if (e.target === qrModal) qrModal.classList.remove('show'); });

  // ============ Row actions (delegate) ============
  document.getElementById('tablesBody').addEventListener('click', async (e) => {
    const editId = e.target.dataset.edit;
    const qrId = e.target.dataset.qr;
    const toggleId = e.target.dataset.toggle;
    const deleteId = e.target.dataset.delete;

    if (editId) {
      const table = currentTables.find(t => String(t.id) === editId);
      if (table) openEditModal(table);
      return;
    }

    if (qrId) {
      const table = currentTables.find(t => String(t.id) === qrId);
      if (table) openQrModal(table);
      return;
    }

    if (toggleId) {
      const currentStatus = e.target.dataset.status;
      const nextStatus = currentStatus === 'active' ? 'inactive' : 'active';
      if (!confirm(`${nextStatus === 'active' ? 'Activate' : 'Deactivate'} this table?`)) return;
      try {
        await api(`${API_BASE}/${toggleId}/status`, { method: 'PUT', body: JSON.stringify({ status: nextStatus }) });
        window.showToast(`Table ${nextStatus === 'active' ? 'activated' : 'deactivated'}.`, 'success');
        loadTables(false);
      } catch (err) {
        window.showToast(err.message || 'Failed to update status.', 'error');
      }
      return;
    }

    if (deleteId) {
      if (!confirm('Delete this table permanently? This cannot be undone.')) return;
      try {
        await api(`${API_BASE}/${deleteId}`, { method: 'DELETE' });
        window.showToast('Table deleted.', 'success');
        loadTables(false);
      } catch (err) {
        window.showToast(err.message || 'Failed to delete table.', 'error');
      }
      return;
    }
  });

  // ============ Load sidebar + header, then init ============
  function loadComponent(url, placeholderId) {
    return fetch(url)
      .then(r => r.text())
      .then(html => {
        const el = document.getElementById(placeholderId);
        el.innerHTML = html;
        el.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          old.replaceWith(s);
        });
      });
  }

  window.PAGE_TITLE = "Tables";
  window.PAGE_SUB = "Manage dine-in tables & QR codes";
  window.onRefresh = () => { loadBaseUrl(); loadTables(true); };

  Promise.all([
    loadComponent('superadminsidedashboard.html', 'sidebar-placeholder'),
    loadComponent('superadminheader.html', 'header-placeholder')
  ]).then(() => {
    loadBaseUrl();
    loadTables(true);
  });
</script>

<!-- ===================== SIDEBAR COMPONENT ===================== -->
<style>
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--graphite-2), #16161d);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 20;
    transition: transform 0.25s ease;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1.1rem 1.2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .sidebar-brand::before {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--crimson-bright), var(--gold), var(--purple, #9b6fd9));
    opacity: 0.6;
  }
  .sidebar-brand img { width: 32px; height: 32px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(217,169,76,0.35), 0 0 14px rgba(217,169,76,0.15); }
  .sidebar-brand .name {
    font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.05rem;
    background: linear-gradient(90deg, var(--text), var(--gold-light));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sidebar-brand .sub { font-family: 'Roboto Mono', monospace; font-size: 0.6rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .maint-pill {
    display: none;
    margin: 0.8rem 1rem 0;
    padding: 0.4rem 0.7rem;
    border-radius: 7px;
    background: rgba(214, 69, 69, 0.12);
    border: 1px solid rgba(214, 69, 69, 0.4);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.5px;
    color: #f2a3a3;
    align-items: center;
    gap: 0.4rem;
  }
  .maint-pill.show { display: flex; }
  .maint-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 rgba(214,69,69,0.6); animation: dotPulse 1.6s ease-out infinite; }
  @keyframes dotPulse { 0%{box-shadow:0 0 0 0 rgba(214,69,69,.55);}70%{box-shadow:0 0 0 6px rgba(214,69,69,0);}100%{box-shadow:0 0 0 0 rgba(214,69,69,0);} }

  /* Test-mode pill — same visual language as maint-pill but amber, so
     it's unmistakably a different state at a glance. */
  .testmode-pill {
    display: none;
    margin: 0.8rem 1rem 0;
    padding: 0.4rem 0.7rem;
    border-radius: 7px;
    background: rgba(217, 169, 76, 0.12);
    border: 1px solid rgba(217, 169, 76, 0.4);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.5px;
    color: var(--gold-light);
    align-items: center;
    gap: 0.4rem;
  }
  .testmode-pill.show { display: flex; }
  .testmode-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(217,169,76,0.6); animation: dotPulseGold 1.6s ease-out infinite; }
  @keyframes dotPulseGold { 0%{box-shadow:0 0 0 0 rgba(217,169,76,.55);}70%{box-shadow:0 0 0 6px rgba(217,169,76,0);}100%{box-shadow:0 0 0 0 rgba(217,169,76,0);} }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar-scroll::-webkit-scrollbar { width: 5px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .nav-group { padding: 0.9rem 0.6rem; }
  .nav-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.5rem 0.6rem 0.35rem;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.62rem 0.7rem;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0.15rem;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    cursor: pointer;
    position: relative;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.85; }
  .nav-item:hover { background: rgba(255,255,255,0.04); transform: translateX(2px); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(192,57,43,0.22), rgba(217,169,76,0.06));
    border-color: rgba(217,169,76,0.35);
    color: var(--gold-light);
  }
  .nav-item.active::before {
    content: '';
    position: absolute; left: -0.6rem; top: 0.2rem; bottom: 0.2rem; width: 3px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--crimson-bright), var(--gold));
  }
  .nav-item.active svg { opacity: 1; }

  .nav-item.stub { opacity: 0.55; }
  .nav-item.stub .badge-inline {
    margin-left: auto;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.55rem;
    padding: 0.12rem 0.4rem;
    border-radius: 4px;
    background: rgba(217,169,76,0.15);
    color: var(--gold-light);
    letter-spacing: 0.5px;
  }
  .nav-item .badge-new {
    margin-left: auto;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.52rem;
    font-weight: 700;
    padding: 0.12rem 0.4rem;
    border-radius: 4px;
    background: linear-gradient(90deg, rgba(46,158,107,0.25), rgba(46,158,107,0.1));
    color: #7fd9ac;
    letter-spacing: 0.4px;
  }

  .sidebar-footer {
    padding: 0.9rem;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logout-btn {
    width: 100%;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: color 0.2s ease, border-color 0.2s ease;
    cursor: pointer;
    font-family: inherit;
  }
  .logout-btn:hover { color: var(--red); border-color: rgba(214,69,69,0.4); }

  /* This spacer lives in the page, not here — pushes .main content right of the fixed sidebar */
  .sidebar-spacer { width: 240px; flex-shrink: 0; }

  @media (max-width: 860px) {
    .sidebar {
      transform: translateX(-100%);
      width: 230px; box-shadow: 20px 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-spacer { display: none; }
  }
</style>

<script>
  // ============ Sidebar behaviour ============
  (function initSidebar() {
    const currentPage = window.location.pathname.split('/').pop() || 'superadmindashboard.html';
    document.querySelectorAll('.nav-item[data-page]').forEach(item => {
      item.classList.toggle('active', item.dataset.page === currentPage);
    });

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        try {
          await fetch('/api/superadmin/auth/logout', { method: 'POST', credentials: 'include' });
        } catch (e) { /* ignore, redirect anyway */ }
        window.location.href = '/superadminlogin.html';
      });
    }

    fetch('/api/superadmin/maintenance', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.enabled) {
          document.getElementById('maintPill').classList.add('show');
        }
      })
      .catch(() => {});

    // Test-mode pill uses the same superadmin-only endpoint the
    // Test Mode page itself reads from, so it reflects the true global
    // DB state (not a URL param or localStorage).
    fetch('/api/superadmin/test-mode', { credentials: 'include' })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.enabled) {
          document.getElementById('testModePill').classList.add('show');
        }
      })
      .catch(() => {});
  })();
</script>

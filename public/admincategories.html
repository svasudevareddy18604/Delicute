<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Manage Categories</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8e44ad;
      --primary-purple-dark: #5c3a52;
      --nav-dark: #3f2838;
      --bg-lilac: #fbf6ee;
      --dark: #2a1f26;
      --muted: #8a7688;
      --border: #ecdfe8;
      --delivered: #2e9e6b;
      --cancelled: #d64545;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(92, 58, 82, 0.08);
      --shadow-md: 0 4px 14px rgba(92, 58, 82, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-lilac);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
      overscroll-behavior: contain;
    }

    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
    }

    header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
    header span { font-size: 0.8rem; opacity: 0.85; }

    .logout {
      background: white;
      color: var(--primary-purple-dark);
      border: none;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
    }

    nav {
      background: var(--nav-dark);
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem;
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

    .container {
      max-width: 700px;
      margin: 1.5rem auto;
      padding: 0 1.25rem 2rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--primary-purple-dark);
      margin: 0 0 1rem;
      text-align: center;
    }

    /* ---- Add form ---- */
    form#categoryForm {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      background: white;
      padding: 0.9rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    form#categoryForm input {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.95rem;
      background: var(--bg-lilac);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }
    form#categoryForm input:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 2px rgba(142, 68, 173, 0.2);
    }

    form#categoryForm button {
      background: var(--primary-purple-dark);
      border: none;
      padding: 0 1.3rem;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    form#categoryForm button:hover { background: var(--nav-dark); }

    /* ---- Table ---- */
    .table-wrapper {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      background: var(--bg-lilac);
      color: var(--primary-purple-dark);
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }
    th:last-child, td:last-child { text-align: right; }
    th.sno-col, td.sno-col { width: 60px; }

    td {
      padding: 0.85rem 0.9rem;
      font-size: 0.92rem;
      border-bottom: 1px solid var(--border);
      color: var(--dark);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--bg-lilac); }

    .cat-sno { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
    .cat-name { font-weight: 600; color: var(--dark); }

    .action-btns { display: inline-flex; gap: 0.4rem; }
    .btn { border: none; border-radius: 7px; cursor: pointer; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.82rem; color: white; transition: opacity 0.2s ease; }
    .btn:hover { opacity: 0.85; }
    .btn-edit { background: var(--primary-purple); }
    .btn-delete { background: var(--cancelled); }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* ---- Edit modal ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(42, 31, 38, 0.55);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 1.25rem;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-header h3 { font-family: 'Playfair Display', serif; color: var(--primary-purple-dark); font-size: 1.2rem; }
    .modal-close { border: none; background: var(--bg-lilac); color: var(--muted); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; }

    .modal-box .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .modal-box label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .modal-box input {
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.9rem;
      background: var(--bg-lilac);
      outline: none;
      width: 100%;
    }
    .modal-box input:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 2px rgba(142, 68, 173, 0.2);
    }
    .modal-actions { display: flex; justify-content: flex-end; }
    .modal-actions button {
      background: var(--primary-purple-dark);
      border: none;
      padding: 0.7rem 1.4rem;
      color: white;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .modal-actions button:hover { background: var(--nav-dark); }

    #toast {
      visibility: hidden;
      min-width: 220px;
      max-width: 300px;
      background: var(--delivered);
      color: white;
      text-align: center;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      position: fixed;
      z-index: 3000;
      top: 20px;
      right: 20px;
      font-size: 0.88rem;
      box-shadow: var(--shadow-md);
    }
    #toast.show {
      visibility: visible;
      animation: slideIn 0.4s ease-out, slideOut 0.4s ease-in 2.6s forwards;
    }

    @keyframes slideIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      header img { height: 42px; }
      .logout { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; top: 0.6rem; right: 0.6rem; }
      nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
      .container { margin: 1rem auto; padding: 0 0.9rem 1.5rem; }
      .section-title { font-size: 1.2rem; }
      form#categoryForm { flex-direction: column; }
      form#categoryForm button { padding: 0.7rem; justify-content: center; }
      th, td { font-size: 0.85rem; padding: 0.7rem 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <button class="logout" onclick="logout()">Logout</button>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
  </header>

  <nav>
    <a href="admindashboard.html">Dashboard</a>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
    <a href="adminpromotions.html">Promotions</a>
  </nav>

  <div class="container">
    <h2 class="section-title">Manage Categories 🗂️</h2>

    <form id="categoryForm">
      <input type="text" id="categoryName" placeholder="Enter new category" required>
      <button type="submit"><i class="fas fa-plus"></i> Add</button>
    </form>

    <div class="table-wrapper">
      <table id="categoriesTable">
        <thead>
          <tr>
            <th class="sno-col">S.No</th>
            <th>Category Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ============ EDIT MODAL ============ -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Edit Category</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <form id="editCategoryForm">
        <input type="hidden" id="editCategoryId">
        <div class="field">
          <label for="editCategoryName">Category Name</label>
          <input type="text" id="editCategoryName" required>
        </div>
        <div class="modal-actions">
          <button type="submit"><i class="fas fa-check"></i> Update</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const tableBody = document.querySelector("#categoriesTable tbody");
    const form = document.getElementById("categoryForm");
    const input = document.getElementById("categoryName");
    const editForm = document.getElementById("editCategoryForm");

    function showToast(msg, success = true) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.background = success ? "#2e9e6b" : "#d64545";
      toast.className = "show";
      setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) {
          window.location.href = "/admin.html";
          return;
        }
        await loadCategories();
      } catch (err) {
        window.location.href = "/admin.html";
        console.error("Auth Check Error:", err);
      }
    });

    // ================= LOAD =================
    async function loadCategories() {
      try {
        const res = await fetch("/api/categories");
        const data = await res.json();
        tableBody.innerHTML = "";

        if (!data.success || data.data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">No categories yet — add one above.</td></tr>`;
          return;
        }

        data.data.forEach((cat, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td class="sno-col cat-sno">${index + 1}</td>
            <td class="cat-name">${cat.name}</td>
            <td>
              <div class="action-btns">
                <button class="btn btn-edit" onclick='openEditModal(${cat.id}, ${JSON.stringify(cat.name)})' title="Edit"><i class="fas fa-pen"></i></button>
                <button class="btn btn-delete" onclick="deleteCategory(${cat.id})" title="Delete"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        showToast("Error loading categories", false);
        console.error("Categories Load Error:", err);
      }
    }

    // ================= ADD =================
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) {
        showToast("Category name cannot be empty", false);
        return;
      }
      try {
        const res = await fetch("/api/categories", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok) {
          showToast("Category added!");
          input.value = "";
          loadCategories();
        } else {
          showToast(data.message || "Error adding category", false);
        }
      } catch (err) {
        showToast("Error adding category", false);
        console.error("Add Category Error:", err);
      }
    });

    // ================= EDIT =================
    function openEditModal(id, name) {
      document.getElementById("editCategoryId").value = id;
      document.getElementById("editCategoryName").value = name;
      document.getElementById("editModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("editModal").classList.remove("open");
    }

    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("editCategoryId").value;
      const name = document.getElementById("editCategoryName").value.trim();

      if (!name) {
        showToast("Category name cannot be empty", false);
        return;
      }

      try {
        const res = await fetch(`/api/categories/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok) {
          showToast("Category updated!");
          closeModal();
          loadCategories();
        } else {
          showToast(data.message || "Error updating category", false);
        }
      } catch (err) {
        showToast("Error updating category", false);
        console.error("Update Category Error:", err);
      }
    });

    // ================= DELETE =================
    async function deleteCategory(id) {
      if (!confirm("Delete this category?")) return;
      try {
        const res = await fetch(`/api/categories/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (res.ok) {
          showToast("Category deleted!");
          loadCategories();
        } else {
          showToast(data.message || "Error deleting category", false);
        }
      } catch (err) {
        showToast("Error deleting category", false);
        console.error("Delete Category Error:", err);
      }
    }

    async function logout() {
      try {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.location.href = "/admin.html";
      } catch (err) {
        showToast("Error logging out", false);
        console.error("Logout Error:", err);
      }
    }
  </script>
</body>
</html>

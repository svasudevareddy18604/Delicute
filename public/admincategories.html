<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Manage Categories</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8B6BC9;
      --primary-purple-dark: #6B4FA0;
      --bg-lilac: #F3EEFA;
      --dark: #2B2B33;
      --muted: #6B6B76;
      --border: #E7E1F2;
      --delivered: #2E8B57;
      --cancelled: #C0392B;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(60, 40, 100, 0.08);
      --shadow-md: 0 4px 14px rgba(60, 40, 100, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-lilac);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: relative;
      text-align: center;
    }

    header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
    header span { font-size: 0.8rem; opacity: 0.85; }

    .logout {
      background: white;
      color: var(--primary-purple-dark);
      border: none;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
    }

    nav {
      background: #1E1E24;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem;
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

    .container {
      max-width: 700px;
      margin: 1.5rem auto;
      padding: 1.25rem;
    }

    .container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--primary-purple-dark);
      margin-bottom: 1rem;
      text-align: center;
    }

    form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      background: white;
      padding: 0.75rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    form input {
      flex: 1;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.95rem;
      background: var(--bg-lilac);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    form input:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 2px rgba(139, 107, 201, 0.2);
      outline: none;
    }

    form button {
      background: var(--primary-purple-dark);
      border: none;
      padding: 0 1.3rem;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }
    form button:hover { background: #5A3F8A; }

    .table-wrapper {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      background: var(--primary-purple-dark);
      color: white;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.75rem 0.9rem;
    }
    th:last-child, td:last-child { text-align: right; }

    td {
      padding: 0.85rem 0.9rem;
      font-size: 0.92rem;
      border-bottom: 1px solid var(--border);
      color: var(--dark);
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #FAF8FE; }

    .cat-id { color: var(--muted); font-size: 0.82rem; }
    .cat-name { font-weight: 500; }

    .btn-delete {
      background: var(--cancelled);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }
    .btn-delete:hover { opacity: 0.85; }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #toast {
      visibility: hidden;
      min-width: 220px;
      max-width: 300px;
      background: var(--delivered);
      color: white;
      text-align: center;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 0.88rem;
      box-shadow: var(--shadow-md);
    }
    #toast.show {
      visibility: visible;
      animation: slideDown 0.4s ease-out, slideUp 0.4s ease-in 2.6s forwards;
    }

    @keyframes slideDown { from { opacity: 0; transform: translate(-50%, 15px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes slideUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, 15px); } }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      header img { height: 42px; }
      .logout { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; }
      nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
      .container { margin: 1rem; padding: 0; }
      .container h2 { font-size: 1.3rem; }
      form { flex-direction: column; }
      form button { padding: 0.7rem; }
      th, td { font-size: 0.85rem; padding: 0.7rem 0.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <button class="logout" onclick="logout()">Logout</button>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
  </header>

  <nav>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
  </nav>

  <div class="container">
    <h2>Manage Categories 🗂️</h2>

    <form id="categoryForm">
      <input type="text" id="categoryName" placeholder="Enter new category" required>
      <button type="submit">Add</button>
    </form>

    <div class="table-wrapper">
      <table id="categoriesTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Category Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const tableBody = document.querySelector("#categoriesTable tbody");
    const form = document.getElementById("categoryForm");
    const input = document.getElementById("categoryName");

    function showToast(msg, success = true) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.background = success ? "#2E8B57" : "#C0392B";
      toast.className = "show";
      setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) {
          window.location.href = "/admin.html";
          return;
        }
        await loadCategories();
      } catch (err) {
        window.location.href = "/admin.html";
      }
    });

    async function loadCategories() {
      const res = await fetch("/api/categories");
      const data = await res.json();
      tableBody.innerHTML = "";
      if (data.success) {
        if (data.data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">No categories yet — add one above.</td></tr>`;
          return;
        }
        data.data.forEach(cat => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td class="cat-id">#${cat.id}</td>
            <td class="cat-name">${cat.name}</td>
            <td><button class="btn-delete" onclick="deleteCategory(${cat.id})" title="Delete"><i class="fas fa-trash"></i></button></td>
          `;
          tableBody.appendChild(row);
        });
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) {
        showToast("Category name cannot be empty", false);
        return;
      }
      try {
        const res = await fetch("/api/categories", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok) {
          showToast("Category added!");
          input.value = "";
          loadCategories();
        } else {
          showToast(data.message || "Error adding category", false);
        }
      } catch (err) {
        showToast("Error adding category", false);
      }
    });

    async function deleteCategory(id) {
      if (!confirm("Delete this category?")) return;
      try {
        const res = await fetch(`/api/categories/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (res.ok) {
          showToast("Category deleted!");
          loadCategories();
        } else {
          showToast(data.message || "Error deleting category", false);
        }
      } catch (err) {
        showToast("Error deleting category", false);
      }
    }

    async function logout() {
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/admin.html";
    }
  </script>
</body>
</html>

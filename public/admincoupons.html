<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Manage Coupons</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8B6BC9;
      --primary-purple-dark: #6B4FA0;
      --bg-lilac: #F3EEFA;
      --dark: #2B2B33;
      --muted: #6B6B76;
      --border: #E7E1F2;
      --delivered: #2E8B57;
      --cancelled: #C0392B;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(60, 40, 100, 0.08);
      --shadow-md: 0 4px 14px rgba(60, 40, 100, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-lilac);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
      overscroll-behavior: contain;
    }

    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
    }

    header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
    header span { font-size: 0.8rem; opacity: 0.85; }

    .logout {
      background: white;
      color: var(--primary-purple-dark);
      border: none;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
    }

    nav {
      background: #1E1E24;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem;
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

    .container {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1.25rem 2rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--primary-purple-dark);
      margin: 1.5rem 0 0.9rem;
      text-align: center;
    }
    .section-title:first-of-type { margin-top: 0; }

    /* ---- Form ---- */
    .form-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 1.25rem;
    }

    form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.25rem; }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field.full { grid-column: 1 / -1; }

    .field label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }

    input, textarea, select {
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.9rem;
      background: var(--bg-lilac);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 2px rgba(139, 107, 201, 0.2);
      outline: none;
    }
    textarea { resize: vertical; min-height: 70px; }
    input[type="file"] { background: white; padding: 0.5rem; }

    .conditional-group {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem 1.25rem;
      padding: 0.9rem;
      background: var(--bg-lilac);
      border-radius: 8px;
      border: 1px dashed var(--border);
    }

    .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; }

    button[type="submit"] {
      background: var(--primary-purple-dark);
      border: none;
      padding: 0.75rem 1.6rem;
      color: white;
      font-weight: 600;
      font-size: 0.92rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button[type="submit"]:hover { background: #5A3F8A; }

    /* ---- Table (desktop) ---- */
    .table-wrapper {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; min-width: 920px; }

    th {
      background: var(--primary-purple-dark);
      color: white;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.7rem 0.8rem;
      white-space: nowrap;
    }

    td {
      padding: 0.75rem 0.8rem;
      font-size: 0.86rem;
      border-bottom: 1px solid var(--border);
      color: var(--dark);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #FAF8FE; }

    .coupon-thumb {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .coupon-code { font-weight: 700; color: var(--primary-purple-dark); }
    .coupon-desc { color: var(--muted); font-size: 0.82rem; max-width: 220px; }
    .type-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--bg-lilac);
      color: var(--primary-purple-dark);
      text-transform: capitalize;
    }

    .action-btns { display: flex; gap: 0.4rem; }
    .btn { border: none; border-radius: 7px; cursor: pointer; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.82rem; color: white; transition: opacity 0.2s ease; }
    .btn:hover { opacity: 0.85; }
    .btn-edit { background: var(--primary-purple); }
    .btn-delete { background: var(--cancelled); }

    .no-coupons { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.9rem; }

    #toast {
      visibility: hidden;
      min-width: 200px;
      max-width: 300px;
      background: var(--delivered);
      color: white;
      text-align: center;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      position: fixed;
      z-index: 2000;
      top: 20px;
      right: 20px;
      font-size: 0.85rem;
      box-shadow: var(--shadow-md);
    }
    #toast.show { visibility: visible; animation: slideIn 0.4s ease-out, slideOut 0.4s ease-in 2.6s forwards; }

    @keyframes slideIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

    /* ================= TABLET ================= */
    @media (max-width: 900px) {
      form { grid-template-columns: 1fr; }
      .conditional-group { grid-template-columns: 1fr; }
    }

    /* ================= MOBILE CARD TABLE ================= */
    @media (max-width: 760px) {
      header h1 { font-size: 1.5rem; }
      header img { height: 42px; }
      .logout { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; top: 0.6rem; right: 0.6rem; }
      nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
      .container { margin: 1rem auto; padding: 0 0.9rem 1.5rem; }
      .section-title { font-size: 1.2rem; }
      .form-card { padding: 1rem; }

      .table-wrapper { overflow: visible; background: none; box-shadow: none; border-radius: 0; }
      table, thead, tbody, th, td, tr { display: block; width: 100%; min-width: 0; }
      thead { display: none; }
      tbody#couponTable { display: flex; flex-direction: column; gap: 0.85rem; }

      tr {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 0.9rem 1rem;
        border: 1px solid var(--border);
      }
      tr.no-coupons-row { box-shadow: none; border: none; background: none; }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0;
        border-bottom: 1px dashed var(--border);
        font-size: 0.85rem;
        text-align: right;
      }
      td:last-child { border-bottom: none; padding-bottom: 0; }
      td:first-child { padding-top: 0; }

      td::before {
        content: attr(data-label);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.02em;
        text-align: left;
      }

      td.cell-image { padding-top: 0; }
      td.cell-image::before { display: none; }
      td.cell-image { justify-content: flex-start; }

      td.cell-actions::before { display: none; }
      td.cell-actions { padding-top: 0.6rem; }
      .action-btns { width: 100%; justify-content: flex-end; }

      .coupon-desc { max-width: 60%; text-align: right; }
    }

    @media (max-width: 420px) {
      .field label, input, textarea, select { font-size: 0.85rem; }
      td { font-size: 0.82rem; }
      td::before { font-size: 0.68rem; }
    }
  </style>
</head>
<body>
  <header>
    <button class="logout" onclick="logout()">Logout</button>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
  </header>

  <nav>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
  </nav>

  <div class="container">
    <h2 class="section-title">Manage Coupons 🎟️</h2>

    <div class="form-card">
      <form id="couponForm" novalidate>
        <input type="hidden" id="couponId">

        <div class="field">
          <label for="code">Coupon Code</label>
          <input type="text" id="code" required>
        </div>

        <div class="field">
          <label for="type">Type</label>
          <select id="type" required>
            <option value="buy_x">Buy X</option>
            <option value="date_range">Date Range</option>
            <option value="min_cart_amount">Min Cart Amount</option>
            <option value="bogo">Buy One Get One Free</option>
          </select>
        </div>

        <div class="field full">
          <label for="description">Description</label>
          <textarea id="description" required></textarea>
        </div>

        <div class="field">
          <label for="image">Image</label>
          <input type="file" id="image" accept="image/*">
        </div>

        <div class="field">
          <label for="discount">Discount Amount (% for Buy_X / Min_Cart_Amount, ₹ for Date Range)</label>
          <input type="number" id="discount" min="0">
        </div>

        <div class="field">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" min="1">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category"></select>
        </div>

        <div class="conditional-group" id="buyXFields">
          <div class="field full">
            <label for="buy_x">Buy_X (Minimum Quantity)</label>
            <input type="number" id="buy_x" min="1">
          </div>
        </div>

        <div class="conditional-group" id="dateFields" style="display:none;">
          <div class="field">
            <label for="valid_from">Valid From</label>
            <input type="date" id="valid_from">
          </div>
          <div class="field">
            <label for="valid_to">Valid To</label>
            <input type="date" id="valid_to">
          </div>
        </div>

        <div class="conditional-group" id="minCartFields" style="display:none;">
          <div class="field">
            <label for="min_cart_amount">Minimum Cart Amount (₹)</label>
            <input type="number" id="min_cart_amount" min="1">
          </div>
          <div class="field">
            <label for="free_item">Free Item (Optional)</label>
            <input type="text" id="free_item" placeholder="e.g., Free Pizza of Our Choice">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit">Save Coupon</button>
        </div>
      </form>
    </div>

    <h2 class="section-title">Coupons List</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Code</th>
            <th>Description</th>
            <th>Discount</th>
            <th>Qty</th>
            <th>Category</th>
            <th>Type</th>
            <th>Validity</th>
            <th>Min Cart</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="couponTable">
          <tr class="no-coupons-row"><td colspan="10" class="no-coupons">Loading coupons...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API_URL = "/api/coupons";

    function showToast(msg, success = true) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.background = success ? "#2E8B57" : "#C0392B";
      toast.className = "show";
      setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function toggleRequiredFields() {
      const type = document.getElementById("type").value;
      const quantityInput = document.getElementById("quantity");
      const categorySelect = document.getElementById("category");
      const discountInput = document.getElementById("discount");
      const minCartAmountInput = document.getElementById("min_cart_amount");
      const freeItemInput = document.getElementById("free_item");

      if (type === "min_cart_amount") {
        quantityInput.removeAttribute("required");
        categorySelect.removeAttribute("required");
        discountInput.removeAttribute("required");
        if (minCartAmountInput) minCartAmountInput.setAttribute("required", "required");
        if (freeItemInput) freeItemInput.removeAttribute("required");
      } else if (type === "bogo") {
        quantityInput.setAttribute("required", "required");
        categorySelect.setAttribute("required", "required");
        discountInput.removeAttribute("required");
      } else {
        quantityInput.setAttribute("required", "required");
        categorySelect.setAttribute("required", "required");
        discountInput.setAttribute("required", "required");
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) {
          window.location.href = "/admin.html";
          return;
        }
        await loadCategories();
        await fetchCoupons();
        toggleRequiredFields();
      } catch (err) {
        window.location.href = "/admin.html";
        console.error("Auth Check Error:", err);
      }
    });

    document.getElementById("type").addEventListener("change", (e) => {
      const type = e.target.value;
      const discountInput = document.getElementById("discount");
      const discountLabel = discountInput.closest(".field").querySelector("label");
      const discountField = discountInput.closest(".field");

      document.getElementById("buyXFields").style.display = type === "buy_x" ? "grid" : "none";
      document.getElementById("dateFields").style.display = type === "date_range" ? "grid" : "none";
      document.getElementById("minCartFields").style.display = type === "min_cart_amount" ? "grid" : "none";

      const isDiscountVisible = type !== "bogo";
      discountField.style.display = isDiscountVisible ? "flex" : "none";

      toggleRequiredFields();
    });

    async function loadCategories() {
      try {
        const res = await fetch("/api/categories");
        const data = await res.json();
        const categorySelect = document.getElementById("category");
        categorySelect.innerHTML = '<option value="">All Categories</option>';
        if (data.success && data.data.length > 0) {
          data.data.forEach(cat => {
            categorySelect.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
          });
        } else {
          categorySelect.innerHTML += `<option value="" disabled>No categories available</option>`;
        }
      } catch (err) {
        showToast("Error loading categories", false);
        console.error("Category Load Error:", err);
      }
    }

    async function fetchCoupons() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const table = document.getElementById("couponTable");
        table.innerHTML = "";

        if (!data.success || data.data.length === 0) {
          table.innerHTML = "<tr class='no-coupons-row'><td colspan='10' class='no-coupons'>No coupons found</td></tr>";
          return;
        }

        data.data.forEach(coupon => {
          const quantityDisplay = coupon.type === "buy_x" ? coupon.buy_x : coupon.quantity;
          const minCartDisplay = coupon.type === "min_cart_amount" ? `₹${coupon.min_cart_amount}` : "-";
          const discountDisplay = coupon.type === "bogo" ? "BOGO" :
                                coupon.type === "date_range" ? `₹${coupon.discount}` :
                                coupon.type === "min_cart_amount" && coupon.discount === 0 && coupon.free_item ? coupon.free_item :
                                `${coupon.discount}%`;

          table.innerHTML += `
            <tr>
              <td class="cell-image" data-label="Image">
                <img class="coupon-thumb" src="${coupon.image}" alt="${coupon.code}" onerror="this.src='https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png'">
              </td>
              <td data-label="Code"><span class="coupon-code">${coupon.code}</span></td>
              <td data-label="Description"><span class="coupon-desc">${coupon.description}</span></td>
              <td data-label="Discount">${discountDisplay}</td>
              <td data-label="Qty">${quantityDisplay || '-'}</td>
              <td data-label="Category">${coupon.category || 'All'}</td>
              <td data-label="Type"><span class="type-badge">${coupon.type.replace(/_/g, " ")}</span></td>
              <td data-label="Validity">${coupon.valid_from ? coupon.valid_from.split("T")[0] : "-"} → ${coupon.valid_to ? coupon.valid_to.split("T")[0] : "-"}</td>
              <td data-label="Min Cart">${minCartDisplay}</td>
              <td class="cell-actions" data-label="Actions">
                <div class="action-btns">
                  <button class="btn btn-edit" onclick="editCoupon(${coupon.id})" title="Edit"><i class="fas fa-pen"></i></button>
                  <button class="btn btn-delete" onclick="deleteCoupon(${coupon.id})" title="Delete"><i class="fas fa-trash"></i></button>
                </div>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        showToast("Error loading coupons", false);
        console.error("Coupon Load Error:", err);
      }
    }

    document.getElementById("couponForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append("code", document.getElementById("code").value);
      formData.append("description", document.getElementById("description").value);
      const type = document.getElementById("type").value;
      formData.append("type", type);

      if (type !== "bogo") {
        const discount = document.getElementById("discount").value;
        formData.append("discount", discount || 0);
      }

      const quantity = document.getElementById("quantity").value;
      if (quantity) formData.append("quantity", quantity);

      const category = document.getElementById("category").value;
      if (category) formData.append("category", category);

      if (type === "buy_x") {
        formData.append("buy_x", document.getElementById("buy_x").value || null);
      } else if (type === "date_range") {
        formData.append("valid_from", document.getElementById("valid_from").value || null);
        formData.append("valid_to", document.getElementById("valid_to").value || null);
      } else if (type === "min_cart_amount") {
        formData.append("min_cart_amount", document.getElementById("min_cart_amount").value || null);
        const freeItem = document.getElementById("free_item").value;
        if (freeItem) formData.append("free_item", freeItem);
      }

      const imageFile = document.getElementById("image").files[0];
      if (imageFile) formData.append("image", imageFile);

      const id = document.getElementById("couponId").value;
      const method = id ? "PUT" : "POST";
      const url = id ? `${API_URL}/${id}` : API_URL;

      try {
        const res = await fetch(url, { method, body: formData });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message || (id ? "Coupon updated!" : "Coupon added!"), true);
          document.getElementById("couponForm").reset();
          document.getElementById("couponId").value = "";
          document.getElementById("type").value = "buy_x";
          document.getElementById("buyXFields").style.display = "grid";
          document.getElementById("dateFields").style.display = "none";
          document.getElementById("minCartFields").style.display = "none";
          document.getElementById("discount").closest(".field").style.display = "flex";
          toggleRequiredFields();
          fetchCoupons();
        } else {
          showToast(data.message || "Error saving coupon", false);
        }
      } catch (err) {
        showToast("Error saving coupon", false);
        console.error("Save Error:", err);
      }
    });

    async function editCoupon(id) {
      try {
        const res = await fetch(`${API_URL}/${id}`);
        const data = await res.json();
        if (data.success) {
          const c = data.data;
          document.getElementById("couponId").value = c.id;
          document.getElementById("code").value = c.code;
          document.getElementById("description").value = c.description;
          document.getElementById("discount").value = c.discount || "";
          document.getElementById("quantity").value = c.quantity || "";
          document.getElementById("category").value = c.category || "";
          document.getElementById("type").value = c.type;
          document.getElementById("buy_x").value = c.buy_x || "";
          document.getElementById("valid_from").value = c.valid_from?.split("T")[0] || "";
          document.getElementById("valid_to").value = c.valid_to?.split("T")[0] || "";
          document.getElementById("min_cart_amount").value = c.min_cart_amount || "";
          document.getElementById("free_item").value = c.free_item || "";

          document.getElementById("buyXFields").style.display = c.type === "buy_x" ? "grid" : "none";
          document.getElementById("dateFields").style.display = c.type === "date_range" ? "grid" : "none";
          document.getElementById("minCartFields").style.display = c.type === "min_cart_amount" ? "grid" : "none";

          const discountField = document.getElementById("discount").closest(".field");
          discountField.style.display = c.type !== "bogo" ? "flex" : "none";

          toggleRequiredFields();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          showToast("Error loading coupon data", false);
        }
      } catch (err) {
        showToast("Error loading coupon data", false);
        console.error("Edit Error:", err);
      }
    }

    async function deleteCoupon(id) {
      if (!confirm("Delete this coupon?")) return;
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message || "Coupon deleted!", true);
          fetchCoupons();
        } else {
          showToast(data.message || "Error deleting coupon", false);
        }
      } catch (err) {
        showToast("Error deleting coupon", false);
        console.error("Delete Error:", err);
      }
    }

    async function logout() {
      try {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.location.href = "/admin.html";
      } catch (err) {
        showToast("Error logging out", false);
        console.error("Logout Error:", err);
      }
    }
  </script>
</body>
</html>

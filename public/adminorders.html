<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Manage Orders</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8e44ad;
      --primary-purple-dark: #5c3a52;
      --nav-dark: #3f2838;
      --bg-lilac: #fbf6ee;
      --dark: #2a1f26;
      --muted: #8a7688;
      --border: #ecdfe8;
      --gold: #d9a94c;
      --gold-light: #f2d49b;
      --pending: #8e44ad;
      --accepted: #7c5295;
      --cooking: #5c3a52;
      --delivered: #2e9e6b;
      --cancelled: #d64545;
      --radius: 14px;
      --shadow-sm: 0 2px 12px rgba(92, 58, 82, 0.08);
      --shadow-md: 0 10px 28px rgba(92, 58, 82, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-lilac);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
      overscroll-behavior: contain;
    }

    /* ---------- Header ---------- */
    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white;
      padding: 1.1rem 1.25rem 1.3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 1000;
      text-align: center;
    }

    header img { height: 50px; width: 50px; object-fit: contain; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.8rem; margin-top: 0.4rem; letter-spacing: 0.3px; }
    header span.tagline { font-size: 0.8rem; opacity: 0.85; }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      opacity: 0.92;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CD964;
      box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.6);
      animation: livePulse 1.6s ease-out infinite;
    }
    .live-dot.offline { background: var(--cancelled); animation: none; box-shadow: none; }
    @keyframes livePulse {
      0%   { box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.55); }
      70%  { box-shadow: 0 0 0 7px rgba(76, 217, 100, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
    }
    #last-updated { opacity: 0.75; font-weight: 500; text-transform: none; letter-spacing: normal; }

    .top-actions {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      position: relative;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

    .notification-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--cancelled);
      color: white;
      border-radius: 50%;
      min-width: 16px;
      height: 16px;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      box-shadow: 0 0 0 2px var(--primary-purple-dark);
    }

    .logout-btn {
      background: white;
      color: var(--primary-purple-dark);
      border: none;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .logout-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0,0,0,0.22); }

    .notification-dropdown {
      display: none;
      position: absolute;
      top: 3rem;
      right: 0;
      width: 270px;
      max-height: 340px;
      overflow-y: auto;
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      z-index: 1500;
      padding: 0.6rem;
      color: var(--dark);
      text-align: left;
      border: 1px solid var(--border);
    }
    .notification-dropdown.show { display: block; }

    .notification-item { padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .notification-item:last-child { border-bottom: none; }
    .notification-item strong { color: var(--primary-purple-dark); }
    .no-notifications-msg { padding: 0.65rem; font-size: 0.85rem; color: var(--muted); text-align: center; }

    .clear-notifications {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.55rem;
      background: var(--bg-lilac);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-purple-dark);
      cursor: pointer;
    }
    .clear-notifications:hover { background: var(--border); }

    /* ---------- Nav ---------- */
    nav {
      background: var(--nav-dark);
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem;
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

    /* ---------- Container ---------- */
    .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1.25rem 2rem; }

    .container h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--primary-purple-dark);
      margin-bottom: 1.25rem;
      text-align: center;
    }

    /* ---------- Date groups (foldable) ---------- */
    #ordersContainer { display: flex; flex-direction: column; gap: 1.1rem; }

    .date-group {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .date-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.9rem 1.2rem;
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
      text-align: left;
      transition: filter 0.15s ease;
    }
    .date-header:hover { filter: brightness(1.06); }

    .date-header-left { display: flex; align-items: center; gap: 0.65rem; }
    .date-chevron { transition: transform 0.25s ease; font-size: 0.9rem; }
    .date-group.collapsed .date-chevron { transform: rotate(-90deg); }

    .date-label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.05rem; }
    .date-sub { font-size: 0.78rem; opacity: 0.85; font-weight: 600; margin-left: 0.35rem; }

    .date-count {
      background: rgba(255,255,255,0.18);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .date-body { display: block; }
    .date-group.collapsed .date-body { display: none; }

    /* ---- Desktop table ---- */
    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }

    th {
      background: var(--bg-lilac);
      color: var(--primary-purple-dark);
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.7rem 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.85rem 0.9rem;
      font-size: 0.86rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--dark);
    }

    tbody tr:hover { background: var(--bg-lilac); }
    tbody tr:last-child td { border-bottom: none; }

    .order-id { font-weight: 700; color: var(--muted); font-size: 0.72rem; display: block; margin-bottom: 2px; }
    .customer-name { font-weight: 700; }

    .new-flag {
      display: inline-block;
      margin-left: 0.4rem;
      background: linear-gradient(45deg, var(--gold), var(--gold-light));
      color: #4a3300;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 1px 7px;
      border-radius: 10px;
      vertical-align: middle;
      animation: newFlagPop 0.4s ease-out;
    }
    @keyframes newFlagPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .items-list { font-size: 0.85rem; }
    .items-list div { padding: 1px 0; }

    .total-price { font-weight: 700; color: var(--primary-purple-dark); }

    .coupon-info { font-size: 0.82rem; color: var(--muted); }
    .coupon-info.has-coupon { color: #B8860B; font-weight: 600; }

    .instructions {
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 180px;
      max-height: 70px;
      overflow-y: auto;
      display: block;
    }

    .status-pill {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 700;
      color: white;
      text-align: center;
    }
    .status-pill.Pending    { background: var(--pending); }
    .status-pill.Accepted   { background: var(--accepted); }
    .status-pill.Cooking    { background: var(--cooking); }
    .status-pill.Delivered  { background: var(--delivered); }
    .status-pill.Cancelled  { background: var(--cancelled); }
    .status-pill.status-syncing { opacity: 0.65; }

    .status-dropdown { position: relative; display: inline-block; }
    .status-selected { cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; }
    .status-selected::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.85);
    }

    .status-options {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      z-index: 100;
      min-width: 130px;
      overflow: hidden;
      list-style: none;
    }
    .status-options.show { display: block; }
    .status-options li {
      padding: 0.55rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--dark);
      transition: background 0.15s ease;
    }
    .status-options li:hover { background: var(--bg-lilac); }

    .actions-row { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    .action-btns { display: flex; gap: 0.4rem; }

    .btn {
      border: none;
      border-radius: 7px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: white;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-cancel { background: var(--gold); color: #4a3300; }
    .btn-delete { background: var(--cancelled); }

    .no-orders {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      padding: 3rem 1rem;
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    /* New order row highlight — fades out on its own */
    tr.order-row-new { animation: rowGlow 2.6s ease-out; }
    @keyframes rowGlow {
      0%   { background: #FFF3D6; box-shadow: inset 0 0 0 2px var(--gold); }
      100% { background: transparent; box-shadow: none; }
    }
    @media (max-width: 860px) {
      tr.order-row-new { animation: rowGlowCard 2.6s ease-out; }
      @keyframes rowGlowCard {
        0%   { background: #FFF3D6; box-shadow: 0 0 0 2px var(--gold); }
        100% { background: white; box-shadow: var(--shadow-sm); }
      }
    }

    tr.order-row-removing { animation: rowFadeOut 0.35s ease forwards; }
    @keyframes rowFadeOut { to { opacity: 0; transform: scaleY(0); } }

    #toast {
      visibility: hidden;
      min-width: 200px;
      max-width: 320px;
      background: var(--delivered);
      color: white;
      text-align: center;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      position: fixed;
      z-index: 3000;
      top: 20px;
      right: 20px;
      font-weight: 500;
      font-size: 0.85rem;
      box-shadow: var(--shadow-md);
    }
    #toast.show { visibility: visible; animation: slideDown 0.4s ease-out, slideUp 0.4s ease-in 2.6s forwards; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

    /* ================= MOBILE / TABLET CARD LAYOUT ================= */
    @media (max-width: 860px) {
      header h1 { font-size: 1.5rem; }
      header img { height: 42px; width: 42px; }
      .container { margin: 1rem auto; padding: 0 0.9rem 1.5rem; }
      .container h2 { font-size: 1.2rem; }

      .date-header { padding: 0.8rem 1rem; }
      .date-label { font-size: 0.96rem; }
      .date-sub { display: block; margin-left: 0; font-size: 0.7rem; }

      .table-wrapper { overflow: visible; }
      table, thead, tbody, th, td, tr { display: block; width: 100%; min-width: 0; }
      thead { display: none; }

      tbody { display: flex; flex-direction: column; gap: 0.75rem; padding: 0.85rem; }

      tr {
        background: #fff;
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        padding: 0.9rem 1rem;
        border: 1px solid var(--border);
      }

      td {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.5rem 0;
        border-bottom: 1px dashed var(--border);
        font-size: 0.85rem;
      }
      td:last-child { border-bottom: none; padding-bottom: 0; }
      td:first-child { padding-top: 0; }

      td::before {
        content: attr(data-label);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        flex: 0 0 90px;
        letter-spacing: 0.02em;
      }

      td.cell-customer::before, td.cell-actions::before { display: none; }
      td.cell-customer { display: block; padding-top: 0; }
      .customer-name { display: block; font-size: 0.96rem; }
      .order-id { margin-bottom: 3px; }

      td.cell-items .items-list,
      td.cell-instructions .instructions,
      td.cell-coupon .coupon-info { text-align: right; max-width: 65%; }

      td.cell-actions { display: block; padding-top: 0.6rem; }
      .actions-row { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      .status-options { left: auto; right: 0; }
    }

    @media (max-width: 480px) {
      .top-actions { right: 0.5rem; gap: 0.35rem; }
      .icon-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .logout-btn { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; }
      nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
      td { font-size: 0.82rem; }
      td::before { flex-basis: 78px; font-size: 0.68rem; }
      .customer-name { font-size: 0.9rem; }
      .date-count { font-size: 0.72rem; padding: 0.25rem 0.6rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-actions">
      <button class="icon-btn" id="enable-sound-btn" title="Enable Notification Sound">
        <i class="fas fa-volume-up"></i>
      </button>
      <button class="icon-btn" id="notification-icon" title="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" id="notification-count">0</span>
      </button>
      <div class="notification-dropdown" id="notification-dropdown">
        <div id="notification-list"></div>
        <button class="clear-notifications" onclick="clearNotifications()">Clear All</button>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span class="tagline">Every Bite Tells A Story</span>
    </div>
    <div class="live-indicator">
      <span class="live-dot" id="live-dot"></span>
      <span id="live-text">Live · Auto-updating</span>
      <span id="last-updated"></span>
    </div>
  </header>

  <nav>
    <a href="admindashboard.html">Dashboard</a>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
    <a href="adminpromotions.html">Promotions</a>
  </nav>

  <div class="container">
    <h2>Manage Orders 📦</h2>
    <div id="ordersContainer">
      <div class="no-orders">Loading orders...</div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    let isSoundEnabled = false;

    const elements = {
      notificationCount: document.getElementById("notification-count"),
      notificationList: document.getElementById("notification-list"),
      notificationDropdown: document.getElementById("notification-dropdown"),
      notificationIcon: document.getElementById("notification-icon"),
      ordersContainer: document.getElementById("ordersContainer"),
      toast: document.getElementById("toast"),
      enableSoundBtn: document.getElementById("enable-sound-btn"),
      liveDot: document.getElementById("live-dot"),
      liveText: document.getElementById("live-text"),
      lastUpdated: document.getElementById("last-updated")
    };

    let notifications = JSON.parse(localStorage.getItem("notifications") || "[]");

    const resumeAudioContext = async () => {
      if (audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch (err) { console.error("Touch resume error:", err); }
      }
    };
    document.addEventListener('touchstart', resumeAudioContext, { once: true });

    function playNotificationSound() {
      if (!isSoundEnabled) { showToast("Please enable sound to hear notifications", false); return; }
      if (audioCtx.state === 'suspended') { showToast("Audio context suspended. Tap Enable Sound again.", false); return; }
      try {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        const frequencies = [440, 523.25, 659.25, 783.99];
        let currentTime = audioCtx.currentTime;
        frequencies.forEach((freq, index) => {
          oscillator.frequency.setValueAtTime(freq, currentTime + index * 1.25);
          gainNode.gain.setValueAtTime(0.8, currentTime + index * 1.25);
          gainNode.gain.exponentialRampToValueAtTime(0.001, currentTime + (index + 1) * 1.25 - 0.1);
        });
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 5);
      } catch (err) {
        console.error("Audio playback error:", err);
        showToast("Error playing notification sound", false);
      }
    }

    elements.enableSoundBtn.addEventListener("click", async () => {
      if (audioCtx.state === 'suspended' || !isSoundEnabled) {
        try {
          await audioCtx.resume();
          isSoundEnabled = true;
          elements.enableSoundBtn.style.opacity = "0.6";
          showToast("Notification sound enabled!");
          playNotificationSound();
        } catch (err) {
          console.error("Audio initialization error:", err);
          showToast("Failed to enable sound. Try again.", false);
        }
      } else {
        showToast("Notification sound already enabled!");
      }
    });

    function showToast(msg, success = true) {
      elements.toast.textContent = msg;
      elements.toast.style.background = success ? "#2e9e6b" : "#d64545";
      elements.toast.className = "show";
      setTimeout(() => elements.toast.className = "", 3000);
    }

    function updateNotificationCount() {
      elements.notificationCount.textContent = notifications.length;
      elements.notificationCount.style.display = notifications.length ? "flex" : "none";
    }

    function renderNotifications() {
      elements.notificationList.innerHTML = notifications.length
        ? notifications.map(n => `
            <div class="notification-item">
              <strong>Order #${n.id}</strong> by ${n.customer_name}<br>
              Table: ${n.table_number} | Total: ₹${n.total.toFixed(2)}
            </div>
          `).join("")
        : '<div class="no-notifications-msg">No new notifications</div>';
      updateNotificationCount();
    }

    function toggleDropdown(event) {
      event.stopPropagation();
      elements.notificationDropdown.classList.toggle("show");
    }

    function clearNotifications() {
      notifications = [];
      localStorage.setItem("notifications", JSON.stringify(notifications));
      renderNotifications();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) { window.location.href = "/admin.html"; return; }
        await fetchOrders();
        renderNotifications();
        startAutoRefresh();
      } catch (err) {
        console.error("Auth check error:", err);
        showToast("Authentication failed", false);
        window.location.href = "/admin.html";
      }
    });

    const socket = io({ auth: { token: getCookie("token") } });

    socket.on("connect", () => { showToast("Connected to notifications"); setLive(true); });

    socket.on("new-order", (order) => {
      handleIncomingOrder(order);
    });

    socket.on("disconnect", () => setLive(false, true));
    socket.on("connect_error", (error) => { console.error("WebSocket error:", error); setLive(false, true); });

    elements.notificationIcon.addEventListener("click", toggleDropdown);
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".status-dropdown") && !e.target.closest("#notification-icon")) {
        document.querySelectorAll(".status-options").forEach(d => d.classList.remove("show"));
        elements.notificationDropdown.classList.remove("show");
        // A dropdown just got closed by an outside click — release any
        // background render that was queued up while it was open.
        if (openDropdownOrderId !== null) {
          openDropdownOrderId = null;
          flushPendingRender();
        }
      }
    });

    /* ================= DATE GROUPING ================= */

    function computeDateKey(order) {
      const raw = order.created_at || order.createdAt || order.order_date || order.date;
      const d = raw ? new Date(raw) : new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function keyForOffsetDays(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function dateLabelForKey(key) {
      if (key === keyForOffsetDays(0)) return "Today";
      if (key === keyForOffsetDays(-1)) return "Yesterday";
      return null;
    }

    function parseKeyToTime(key) {
      const [dd, mm, yyyy] = key.split('-').map(Number);
      return new Date(yyyy, mm - 1, dd).getTime();
    }

    const statusPriority = { Pending: 1, Accepted: 2, Cooking: 3, Delivered: 4, Cancelled: 5 };

    function groupOrders() {
      const groups = new Map();
      for (const order of ordersById.values()) {
        const key = order.__dateKey;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(order);
      }
      const sortedKeys = [...groups.keys()].sort((a, b) => parseKeyToTime(b) - parseKeyToTime(a));
      return sortedKeys.map(key => ({
        key,
        orders: groups.get(key).sort((a, b) => statusPriority[a.status] - statusPriority[b.status])
      }));
    }

    /* ================= LIVE STATE / SYNC ENGINE ================= */

    let ordersById = new Map();
    let notifiedIds = new Set();
    let recentlyNewIds = new Set();
    let collapsedDates = new Set();
    let firstLoadDone = false;
    let isFetching = false;
    let pollTimer = null;
    let pollDelay = 1000;
    const POLL_DELAY_MIN = 1000;
    const POLL_DELAY_MAX = 8000;
    let consecutiveErrors = 0;

    // ---- Status-update race-condition guards ----
    // Which order's status dropdown is currently open (null if none).
    let openDropdownOrderId = null;
    // True if a background poll wanted to re-render while a dropdown was open.
    let pendingRenderAfterDropdownClose = false;
    // orderId -> { status, expiresAt } — status changes the user just made,
    // protected from being overwritten by a stale/slow poll response.
    let pendingStatusUpdates = new Map();
    const STATUS_LOCK_MS = 6000;

    function setLive(online) {
      elements.liveDot.classList.toggle("offline", !online);
      elements.liveText.textContent = online ? "Live · Auto-updating" : "Reconnecting…";
    }

    function touchLastUpdated() {
      const t = new Date();
      elements.lastUpdated.textContent = "· updated " + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function startAutoRefresh() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(runPollTick, pollDelay);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        } else {
          runPollTick();
          if (!pollTimer) pollTimer = setInterval(runPollTick, pollDelay);
        }
      });
    }

    function reschedulePoll(newDelay) {
      pollDelay = Math.max(POLL_DELAY_MIN, Math.min(POLL_DELAY_MAX, newDelay));
      if (pollTimer) clearInterval(pollTimer);
      if (!document.hidden) pollTimer = setInterval(runPollTick, pollDelay);
    }

    async function runPollTick() {
      if (isFetching) return;
      isFetching = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);
      try {
        const res = await fetch("/api/orders", { credentials: "include", signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "Bad response");

        processServerOrders(data.data || []);
        setLive(true);
        touchLastUpdated();

        if (consecutiveErrors > 0) { consecutiveErrors = 0; reschedulePoll(1000); }
      } catch (err) {
        clearTimeout(timeoutId);
        consecutiveErrors++;
        setLive(false);
        reschedulePoll(pollDelay * 1.6);
        console.warn("Auto-refresh tick failed:", err.message || err);
      } finally {
        isFetching = false;
      }
    }

    // A render triggered by the background poll. If the admin currently has
    // a status dropdown open, we don't rebuild the table underneath them —
    // we just remember that a render is owed, and fire it the moment the
    // dropdown closes.
    function safeRender() {
      if (openDropdownOrderId !== null) {
        pendingRenderAfterDropdownClose = true;
        return;
      }
      render();
    }

    function flushPendingRender() {
      if (pendingRenderAfterDropdownClose) {
        pendingRenderAfterDropdownClose = false;
        render();
      }
    }

    // Merges the latest server snapshot into local state, detects brand-new
    // orders for notification, then re-renders (safely).
    function processServerOrders(serverOrders) {
      const incomingIds = new Set();
      const newIds = [];

      serverOrders.forEach(order => {
        order.__dateKey = computeDateKey(order);
        incomingIds.add(order.id);

        // If we just changed this order's status locally, don't let a
        // slow/stale poll response flip it back before the server catches up.
        const pending = pendingStatusUpdates.get(order.id);
        if (pending) {
          if (order.status === pending.status) {
            pendingStatusUpdates.delete(order.id); // server has confirmed it
          } else if (Date.now() < pending.expiresAt) {
            order.status = pending.status; // keep our optimistic value
          } else {
            pendingStatusUpdates.delete(order.id); // gave it long enough, trust server
          }
        }

        if (!ordersById.has(order.id) && firstLoadDone && !notifiedIds.has(order.id)) {
          newIds.push(order.id);
        }
        ordersById.set(order.id, order);
      });

      for (const id of [...ordersById.keys()]) {
        if (!incomingIds.has(id)) {
          ordersById.delete(id);
          recentlyNewIds.delete(id);
          pendingStatusUpdates.delete(id);
        }
      }

      if (newIds.length > 0) announceNewOrders(newIds);

      firstLoadDone = true;
      safeRender();
    }

    function announceNewOrders(ids) {
      ids.forEach(id => {
        const order = ordersById.get(id);
        notifiedIds.add(id);
        recentlyNewIds.add(id);
        collapsedDates.delete(order.__dateKey); // guarantee it's visible, not folded away
        playNotificationSound();
        showToast(`New Order #${order.id} by ${order.customer_name} for ₹${order.total.toFixed(2)}`);
        notifications.unshift(order);
        setTimeout(() => { recentlyNewIds.delete(id); safeRender(); }, 6000);
      });
      localStorage.setItem("notifications", JSON.stringify(notifications));
      renderNotifications();
    }

    function handleIncomingOrder(order) {
      order.__dateKey = computeDateKey(order);
      ordersById.set(order.id, order);
      if (!notifiedIds.has(order.id)) {
        announceNewOrders([order.id]);
      }
      safeRender();
    }

    /* ================= RENDER ================= */

    async function fetchOrders() {
      try {
        const res = await fetch("/api/orders", { credentials: "include" });
        const data = await res.json();
        ordersById.clear();
        collapsedDates.clear();

        if (data.success && data.data.length) {
          data.data.forEach(o => {
            o.__dateKey = computeDateKey(o);
            ordersById.set(o.id, o);
            notifiedIds.add(o.id);
          });
          // Default view: Today expanded, every earlier date folded.
          const todayKey = keyForOffsetDays(0);
          groupOrders().forEach(g => { if (g.key !== todayKey) collapsedDates.add(g.key); });
        }
        firstLoadDone = true;
        render();
        touchLastUpdated();
      } catch (err) {
        showToast("Error loading orders", false);
        console.error("Orders Load Error:", err);
      }
    }

    function render() {
      const groups = groupOrders();
      if (groups.length === 0) {
        elements.ordersContainer.innerHTML = `<div class="no-orders">No orders found</div>`;
        return;
      }
      elements.ordersContainer.innerHTML = groups.map(buildDateGroupHtml).join("");
    }

    function buildDateGroupHtml(group) {
      const label = dateLabelForKey(group.key);
      const isCollapsed = collapsedDates.has(group.key);
      const count = group.orders.length;
      return `
        <div class="date-group ${isCollapsed ? 'collapsed' : ''}" data-date-key="${group.key}">
          <button class="date-header" onclick="toggleDateGroup('${group.key}')">
            <span class="date-header-left">
              <i class="fas fa-chevron-down date-chevron"></i>
              ${label
                ? `<span class="date-label">${label}</span><span class="date-sub">${group.key}</span>`
                : `<span class="date-label">${group.key}</span>`}
            </span>
            <span class="date-count">${count} order${count !== 1 ? 's' : ''}</span>
          </button>
          <div class="date-body">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Table</th>
                    <th>Items (Qty)</th>
                    <th>Total</th>
                    <th>Coupon</th>
                    <th>Instructions</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${group.orders.map(o => buildOrderRow(o, recentlyNewIds.has(o.id))).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function toggleDateGroup(key) {
      if (collapsedDates.has(key)) collapsedDates.delete(key); else collapsedDates.add(key);
      render();
    }

    function buildOrderRow(order, isNew) {
      const items = Array.isArray(order.items)
        ? order.items.map(i => `<div>${i.name} (x${i.qty ?? 1})</div>`).join("")
        : `<div>${order.items}</div>`;
      const instructions = order.instructions || "None";
      const hasCoupon = !!order.coupon_code;
      const couponInfo = hasCoupon
        ? `${order.coupon_code} · -₹${order.discount.toFixed(2)}`
        : "No coupon used";
      const isSyncing = pendingStatusUpdates.has(order.id);

      return `
        <tr id="order-row-${order.id}" class="${isNew ? 'order-row-new' : ''}">
          <td class="cell-customer">
            <span class="order-id">Order #${order.id}</span>
            <span class="customer-name">${order.customer_name}${isNew ? '<span class="new-flag">NEW</span>' : ''}</span>
          </td>
          <td data-label="Table">${order.table_number}</td>
          <td data-label="Items" class="cell-items"><div class="items-list">${items}</div></td>
          <td data-label="Total"><span class="total-price">₹${order.total.toFixed(2)}</span></td>
          <td data-label="Coupon" class="cell-coupon"><span class="coupon-info ${hasCoupon ? "has-coupon" : ""}">${couponInfo}</span></td>
          <td data-label="Notes" class="cell-instructions"><span class="instructions">${instructions}</span></td>
          <td data-label="Status">
            <div class="status-dropdown">
              <div class="status-selected status-pill ${order.status}${isSyncing ? ' status-syncing' : ''}" onclick="toggleDropdownStatus(event, ${order.id})">${order.status}${isSyncing ? ' <i class="fas fa-spinner fa-spin" style="font-size:0.7em;"></i>' : ''}</div>
              <ul class="status-options" id="dropdown-${order.id}">
                <li onclick="updateStatus(${order.id}, 'Pending')">Pending</li>
                <li onclick="updateStatus(${order.id}, 'Accepted')">Accepted</li>
                <li onclick="updateStatus(${order.id}, 'Cooking')">Cooking</li>
                <li onclick="updateStatus(${order.id}, 'Delivered')">Delivered</li>
                <li onclick="updateStatus(${order.id}, 'Cancelled')">Cancelled</li>
              </ul>
            </div>
          </td>
          <td class="cell-actions">
            <div class="actions-row">
              <div class="action-btns">
                ${order.status !== "Cancelled" && order.status !== "Delivered"
                  ? `<button class="btn btn-cancel" onclick="cancelOrder(${order.id})" title="Cancel Order"><i class="fas fa-ban"></i></button>`
                  : ""}
                <button class="btn btn-delete" onclick="deleteOrder(${order.id})" title="Delete Order"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function toggleDropdownStatus(event, id) {
      event.stopPropagation();
      const dropdown = document.getElementById(`dropdown-${id}`);
      if (!dropdown) return;

      const isOpening = openDropdownOrderId !== id;

      document.querySelectorAll(".status-options").forEach(d => d.classList.remove("show"));

      if (isOpening) {
        dropdown.classList.add("show");
        openDropdownOrderId = id;
      } else {
        openDropdownOrderId = null;
        flushPendingRender();
      }
    }

    async function updateStatus(id, status) {
      const order = ordersById.get(id);
      const previousStatus = order ? order.status : null;

      // Optimistic update: reflect the new status immediately, close the
      // dropdown, and lock this order against being overwritten by a
      // background poll that hasn't seen the server's update yet.
      if (order) order.status = status;
      pendingStatusUpdates.set(id, { status, expiresAt: Date.now() + STATUS_LOCK_MS });
      openDropdownOrderId = null;
      document.querySelectorAll(".status-options").forEach(d => d.classList.remove("show"));
      render();

      try {
        const res = await fetch(`/api/orders/${id}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Order #${id} marked as ${status}!`);
        } else {
          showToast("Failed: " + data.message, false);
          if (order) order.status = previousStatus;
          pendingStatusUpdates.delete(id);
          render();
        }
      } catch (err) {
        showToast("Error updating status", false);
        console.error("Status Update Error:", err);
        if (order) order.status = previousStatus;
        pendingStatusUpdates.delete(id);
        render();
      }
    }

    async function cancelOrder(id) {
      if (!confirm("Are you sure you want to cancel this order?")) return;
      const order = ordersById.get(id);
      const previousStatus = order ? order.status : null;

      if (order) order.status = "Cancelled";
      pendingStatusUpdates.set(id, { status: "Cancelled", expiresAt: Date.now() + STATUS_LOCK_MS });
      render();

      try {
        const res = await fetch(`/api/orders/${id}/cancel`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ status: "Cancelled" })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Order #${id} cancelled!`);
        } else {
          showToast("Failed: " + (data.message || "Unable to cancel order"), false);
          if (order) order.status = previousStatus;
          pendingStatusUpdates.delete(id);
          render();
        }
      } catch (err) {
        showToast("Error cancelling order", false);
        console.error("Cancel Error:", err);
        if (order) order.status = previousStatus;
        pendingStatusUpdates.delete(id);
        render();
      }
    }

    async function deleteOrder(id) {
      if (!confirm("Are you sure you want to delete this order?")) return;
      try {
        const res = await fetch(`/api/orders/${id}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          credentials: "include"
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Order #${id} deleted!`);
          const row = document.getElementById(`order-row-${id}`);
          if (row) {
            row.classList.add("order-row-removing");
            setTimeout(() => {
              ordersById.delete(id);
              recentlyNewIds.delete(id);
              pendingStatusUpdates.delete(id);
              render();
            }, 350);
          } else {
            ordersById.delete(id);
            pendingStatusUpdates.delete(id);
            render();
          }
        } else {
          showToast("Failed: " + (data.message || "Unable to delete order"), false);
        }
      } catch (err) {
        showToast("Error deleting order", false);
        console.error("Delete Error:", err);
      }
    }

    async function logout() {
      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include"
        });
        window.location.href = "/admin.html";
      } catch (err) {
        console.error("Logout error:", err);
        window.location.href = "/admin.html";
      }
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      return parts.length === 2 ? parts.pop().split(";").shift() : null;
    }
  </script>
</body>
</html>

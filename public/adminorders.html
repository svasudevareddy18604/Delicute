<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Manage Orders</title>
  <link rel="icon" href="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --primary-purple: #8B6BC9;
      --primary-purple-dark: #6B4FA0;
      --secondary-purple: #D8BFD8;
      --bg-lilac: #F3EEFA;
      --dark: #2B2B33;
      --muted: #6B6B76;
      --border: #E7E1F2;
      --pending: #9370DB;
      --preparing: #6A5ACD;
      --delivered: #2E8B57;
      --cancelled: #C0392B;
      --gold: #D9A94C;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(60, 40, 100, 0.08);
      --shadow-md: 0 4px 14px rgba(60, 40, 100, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-lilac);
      color: var(--dark);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      background: linear-gradient(90deg, var(--primary-purple-dark), var(--primary-purple));
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md);
      position: relative;
      text-align: center;
    }

    header img { height: 50px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-top: 0.4rem; }
    header span { font-size: 0.8rem; opacity: 0.85; }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.35rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CD964;
      box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.6);
      animation: livePulse 1.6s ease-out infinite;
    }
    .live-dot.offline { background: var(--cancelled); animation: none; box-shadow: none; }
    @keyframes livePulse {
      0%   { box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.55); }
      70%  { box-shadow: 0 0 0 7px rgba(76, 217, 100, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
    }
    #last-updated { opacity: 0.75; font-weight: 500; text-transform: none; letter-spacing: normal; }

    .top-actions {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      position: relative;
      transition: background 0.2s ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.28); }

    .notification-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--cancelled);
      color: white;
      border-radius: 50%;
      min-width: 16px;
      height: 16px;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    .logout-btn {
      background: white;
      color: var(--primary-purple-dark);
      border: none;
      padding: 0 0.9rem;
      height: 38px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .notification-dropdown {
      display: none;
      position: absolute;
      top: 3rem;
      right: 0;
      width: 260px;
      max-height: 320px;
      overflow-y: auto;
      background: white;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      z-index: 1000;
      padding: 0.6rem;
      color: var(--dark);
      text-align: left;
    }
    .notification-dropdown.show { display: block; }

    .notification-item {
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .notification-item:last-child { border-bottom: none; }
    .notification-item strong { color: var(--primary-purple-dark); }

    .no-notifications { padding: 0.6rem; font-size: 0.82rem; color: var(--muted); text-align: center; }

    .clear-notifications {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.5rem;
      background: var(--bg-lilac);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-purple-dark);
      cursor: pointer;
    }

    nav {
      background: #1E1E24;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    nav a {
      flex: 0 0 auto;
      padding: 0.85rem 1.1rem;
      color: #ddd;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a:hover { background: rgba(139, 107, 201, 0.25); color: #fff; }

    .container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 1.25rem;
    }

    .container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--primary-purple-dark);
      margin-bottom: 1rem;
      text-align: center;
    }

    /* ---- Desktop table ---- */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    table { width: 100%; border-collapse: collapse; min-width: 900px; }

    th {
      background: var(--primary-purple-dark);
      color: white;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.75rem 0.9rem;
    }

    td {
      padding: 0.85rem 0.9rem;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--dark);
    }

    tbody tr:hover { background: #FAF8FE; }
    tbody tr:last-child td { border-bottom: none; }

    .order-id { font-weight: 600; color: var(--muted); font-size: 0.75rem; display: block; margin-bottom: 2px; }
    .customer-name { font-weight: 600; }

    .new-flag {
      display: inline-block;
      margin-left: 0.4rem;
      background: linear-gradient(45deg, var(--gold), #f2d49b);
      color: #4a3300;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 1px 7px;
      border-radius: 10px;
      vertical-align: middle;
      animation: newFlagPop 0.4s ease-out;
    }
    @keyframes newFlagPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .items-list { font-size: 0.85rem; }
    .items-list div { padding: 1px 0; }

    .total-price { font-weight: 700; color: var(--primary-purple-dark); }

    .coupon-info { font-size: 0.82rem; color: var(--muted); }
    .coupon-info.has-coupon { color: #B8860B; font-weight: 500; }

    .instructions {
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 180px;
      max-height: 70px;
      overflow-y: auto;
      display: block;
    }

    .status-pill {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: white;
      text-align: center;
    }
    .status-pill.Pending    { background: var(--pending); }
    .status-pill.Accepted { background: var(--preparing); }
    .status-pill.Cooking { background: #6A5ACD; }
    .status-pill.Delivered  { background: var(--delivered); }
    .status-pill.Cancelled  { background: var(--cancelled); }

    .status-dropdown { position: relative; display: inline-block; }

    .status-selected {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .status-selected::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      font-size: 0.65rem;
      color: var(--muted);
    }

    .status-options {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      z-index: 100;
      min-width: 130px;
      overflow: hidden;
      list-style: none;
    }
    .status-options.show { display: block; }
    .status-options li {
      padding: 0.55rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--dark);
      transition: background 0.15s ease;
    }
    .status-options li:hover { background: var(--bg-lilac); }

    .actions-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .action-btns { display: flex; gap: 0.4rem; }

    .btn {
      border: none;
      border-radius: 7px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: white;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.85; }
    .btn-cancel { background: #B08D57; }
    .btn-delete { background: var(--cancelled); }

    .no-orders { font-size: 0.95rem; color: var(--muted); text-align: center; padding: 2.5rem 1rem; }

    /* New order row highlight — fades out on its own */
    tr.order-row-new {
      animation: rowGlow 2.6s ease-out;
    }
    @keyframes rowGlow {
      0%   { background: #FFF3D6; box-shadow: 0 0 0 2px var(--gold); }
      100% { background: transparent; box-shadow: none; }
    }
    @media (max-width: 860px) {
      tr.order-row-new { animation: rowGlowCard 2.6s ease-out; }
      @keyframes rowGlowCard {
        0%   { background: #FFF3D6; box-shadow: 0 0 0 2px var(--gold); }
        100% { background: white; box-shadow: var(--shadow-sm); }
      }
    }

    tr.order-row-removing {
      animation: rowFadeOut 0.35s ease forwards;
    }
    @keyframes rowFadeOut {
      to { opacity: 0; transform: scaleY(0); }
    }

    #toast {
      visibility: hidden;
      min-width: 200px;
      max-width: 300px;
      background: var(--delivered);
      color: white;
      text-align: center;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      position: fixed;
      z-index: 2000;
      top: 80px;
      right: 20px;
      font-size: 0.85rem;
      box-shadow: var(--shadow-md);
    }
    #toast.show { visibility: visible; animation: slideDown 0.4s ease-out, slideUp 0.4s ease-in 2.6s forwards; }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-15px); } }

    /* ================= MOBILE / TABLET CARD LAYOUT ================= */
    @media (max-width: 860px) {
      header h1 { font-size: 1.5rem; }
      header img { height: 42px; }
      .container { margin: 1rem; padding: 0; }
      .container h2 { font-size: 1.3rem; }

      .table-wrapper { overflow: visible; background: none; box-shadow: none; border-radius: 0; }

      table, thead, tbody, th, td, tr { display: block; width: 100%; min-width: 0; }
      thead { display: none; }

      tbody#ordersTable { display: flex; flex-direction: column; gap: 0.85rem; }

      tr {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 0.9rem 1rem;
        border: 1px solid var(--border);
      }

      tr.no-orders-row { box-shadow: none; border: none; background: none; }

      td {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.5rem 0;
        border-bottom: 1px dashed var(--border);
        font-size: 0.85rem;
      }
      td:last-child { border-bottom: none; padding-bottom: 0; }
      td:first-child { padding-top: 0; }

      td::before {
        content: attr(data-label);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--muted);
        flex: 0 0 90px;
        letter-spacing: 0.02em;
      }

      td.cell-customer::before,
      td.cell-actions::before { display: none; }

      td.cell-customer { display: block; padding-top: 0; }
      .customer-name { display: block; font-size: 0.98rem; }
      .order-id { margin-bottom: 3px; }

      td.cell-items .items-list,
      td.cell-instructions .instructions,
      td.cell-coupon .coupon-info { text-align: right; max-width: 65%; }

      td.cell-actions {
        display: block;
        padding-top: 0.6rem;
      }
      .actions-row { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      .status-options { left: auto; right: 0; }
    }

    @media (max-width: 480px) {
      header .top-actions { right: 0.5rem; gap: 0.35rem; }
      .icon-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .logout-btn { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; }
      nav a { font-size: 0.82rem; padding: 0.7rem 0.85rem; }
      td { font-size: 0.82rem; }
      td::before { flex-basis: 78px; font-size: 0.68rem; }
      .customer-name { font-size: 0.92rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-actions">
      <button class="icon-btn" id="enable-sound-btn" title="Enable Notification Sound">
        <i class="fas fa-volume-up"></i>
      </button>
      <button class="icon-btn" id="notification-icon" title="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" id="notification-count">0</span>
      </button>
      <div class="notification-dropdown" id="notification-dropdown">
        <div id="notification-list"></div>
        <button class="clear-notifications" onclick="clearNotifications()">Clear All</button>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <img src="https://i.postimg.cc/W3pgQx9q/DELICUTE-Imgur-1-modified.png" alt="DELICUTE Logo">
    <div>
      <h1>DELICUTE</h1>
      <span>Every Bite Tells A Story</span>
    </div>
    <div class="live-indicator">
      <span class="live-dot" id="live-dot"></span>
      <span id="live-text">Live · Auto-updating</span>
      <span id="last-updated"></span>
    </div>
  </header>

  <nav>
    <a href="admindashboard.html">Dashboard</a>
    <a href="adminorders.html">Orders</a>
    <a href="adminmenu.html">Menu</a>
    <a href="admincoupons.html">Coupons</a>
    <a href="admincategories.html">Categories</a>
    <a href="admintoppicks.html">Top Picks</a>
  </nav>

  <div class="container">
    <h2>Manage Orders 📦</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Table</th>
            <th>Items (Qty)</th>
            <th>Total</th>
            <th>Coupon</th>
            <th>Address</th>
            <th>Instructions</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="ordersTable">
          <tr class="no-orders-row"><td colspan="9" class="no-orders">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    let isSoundEnabled = false;

    const elements = {
      notificationCount: document.getElementById("notification-count"),
      notificationList: document.getElementById("notification-list"),
      notificationDropdown: document.getElementById("notification-dropdown"),
      notificationIcon: document.getElementById("notification-icon"),
      ordersTable: document.getElementById("ordersTable"),
      toast: document.getElementById("toast"),
      enableSoundBtn: document.getElementById("enable-sound-btn"),
      liveDot: document.getElementById("live-dot"),
      liveText: document.getElementById("live-text"),
      lastUpdated: document.getElementById("last-updated")
    };

    let notifications = JSON.parse(localStorage.getItem("notifications") || "[]");

    const resumeAudioContext = async () => {
      if (audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch (err) { console.error("Touch resume error:", err); }
      }
    };
    document.addEventListener('touchstart', resumeAudioContext, { once: true });

    function playNotificationSound() {
      if (!isSoundEnabled) { showToast("Please enable sound to hear notifications", false); return; }
      if (audioCtx.state === 'suspended') { showToast("Audio context suspended. Tap Enable Sound again.", false); return; }
      try {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        const frequencies = [440, 523.25, 659.25, 783.99];
        let currentTime = audioCtx.currentTime;
        frequencies.forEach((freq, index) => {
          oscillator.frequency.setValueAtTime(freq, currentTime + index * 1.25);
          gainNode.gain.setValueAtTime(0.8, currentTime + index * 1.25);
          gainNode.gain.exponentialRampToValueAtTime(0.001, currentTime + (index + 1) * 1.25 - 0.1);
        });
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 5);
      } catch (err) {
        console.error("Audio playback error:", err);
        showToast("Error playing notification sound", false);
      }
    }

    elements.enableSoundBtn.addEventListener("click", async () => {
      if (audioCtx.state === 'suspended' || !isSoundEnabled) {
        try {
          await audioCtx.resume();
          isSoundEnabled = true;
          elements.enableSoundBtn.style.opacity = "0.6";
          showToast("Notification sound enabled!");
          playNotificationSound();
        } catch (err) {
          console.error("Audio initialization error:", err);
          showToast("Failed to enable sound. Try again.", false);
        }
      } else {
        showToast("Notification sound already enabled!");
      }
    });

    function showToast(msg, success = true) {
      elements.toast.textContent = msg;
      elements.toast.style.background = success ? "#2E8B57" : "#C0392B";
      elements.toast.className = "show";
      setTimeout(() => elements.toast.className = "", 3000);
    }

    function updateNotificationCount() {
      elements.notificationCount.textContent = notifications.length;
      elements.notificationCount.style.display = notifications.length ? "flex" : "none";
    }

    function renderNotifications() {
      elements.notificationList.innerHTML = notifications.length
        ? notifications.map(n => `
            <div class="notification-item">
              <strong>Order #${n.id}</strong> by ${n.customer_name}<br>
              Table: ${n.table_number} | Total: ₹${n.total.toFixed(2)}
            </div>
          `).join("")
        : '<div class="no-notifications">No new notifications</div>';
      updateNotificationCount();
    }

    function toggleDropdown(event) {
      event.stopPropagation();
      elements.notificationDropdown.classList.toggle("show");
    }

    function clearNotifications() {
      notifications = [];
      localStorage.setItem("notifications", JSON.stringify(notifications));
      renderNotifications();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/check", { credentials: "include" });
        if (!res.ok) { window.location.href = "/admin.html"; return; }
        await fetchOrders();      // full initial render
        renderNotifications();
        startAutoRefresh();       // begin 1-second smart sync
      } catch (err) {
        console.error("Auth check error:", err);
        showToast("Authentication failed", false);
        window.location.href = "/admin.html";
      }
    });

    const socket = io({ auth: { token: getCookie("token") } });

    socket.on("connect", () => {
      showToast("Connected to notifications");
      setLive(true);
    });

    socket.on("new-order", (order) => {
      // Socket push handles the instant case; polling below will simply
      // see it's already known and skip re-notifying.
      handleIncomingOrder(order, true);
    });

    socket.on("disconnect", () => setLive(false, true));
    socket.on("connect_error", (error) => {
      console.error("WebSocket error:", error);
      setLive(false, true);
    });

    elements.notificationIcon.addEventListener("click", toggleDropdown);
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".status-dropdown") && !e.target.closest("#notification-icon")) {
        document.querySelectorAll(".status-options").forEach(d => d.classList.remove("show"));
        elements.notificationDropdown.classList.remove("show");
      }
    });

    /* ================= LIVE STATE / SYNC ENGINE ================= */

    // Tracks id -> status for every order currently rendered.
    let knownOrders = new Map();
    let isFetching = false;
    let pollTimer = null;
    let pollDelay = 1000;              // starts at 1s as requested
    const POLL_DELAY_MIN = 1000;
    const POLL_DELAY_MAX = 8000;       // backs off up to 8s on repeated failures
    let consecutiveErrors = 0;

    function setLive(online, isSocketIssue = false) {
      elements.liveDot.classList.toggle("offline", !online);
      elements.liveText.textContent = online ? "Live · Auto-updating" : "Reconnecting…";
      if (!online && isSocketIssue) {
        // Socket dropped, but 1s polling below keeps data fresh regardless.
      }
    }

    function touchLastUpdated() {
      const t = new Date();
      elements.lastUpdated.textContent = "· updated " + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function startAutoRefresh() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(runPollTick, pollDelay);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        } else {
          // Refresh instantly when the tab regains focus, then resume ticking.
          runPollTick();
          if (!pollTimer) pollTimer = setInterval(runPollTick, pollDelay);
        }
      });
    }

    function reschedulePoll(newDelay) {
      pollDelay = Math.max(POLL_DELAY_MIN, Math.min(POLL_DELAY_MAX, newDelay));
      if (pollTimer) clearInterval(pollTimer);
      if (!document.hidden) pollTimer = setInterval(runPollTick, pollDelay);
    }

    async function runPollTick() {
      if (isFetching) return;   // never let requests stack up under load
      isFetching = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      try {
        const res = await fetch("/api/orders", { credentials: "include", signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "Bad response");

        syncOrders(data.data || []);
        setLive(true);
        touchLastUpdated();

        if (consecutiveErrors > 0) {
          consecutiveErrors = 0;
          reschedulePoll(1000); // recovered — back to full 1s speed
        }
      } catch (err) {
        clearTimeout(timeoutId);
        consecutiveErrors++;
        setLive(false);
        // Back off gradually so a slow/down server never gets hammered
        // by every open admin tab at once.
        reschedulePoll(pollDelay * 1.6);
        console.warn("Auto-refresh tick failed:", err.message || err);
      } finally {
        isFetching = false;
      }
    }

    // Diff-based sync: only touches rows that actually changed.
    function syncOrders(serverOrders) {
      if (serverOrders.length === 0 && knownOrders.size === 0) {
        if (!elements.ordersTable.querySelector(".no-orders")) {
          elements.ordersTable.innerHTML = "<tr class='no-orders-row'><td colspan='9' class='no-orders'>No orders found</td></tr>";
        }
        return;
      }

      elements.ordersTable.querySelector(".no-orders-row")?.remove();

      const statusPriority = {
  Pending: 1,
  Accepted: 2,
  Cooking: 3,
  Delivered: 4,
  Cancelled: 5
};
      serverOrders.sort((a, b) => statusPriority[a.status] - statusPriority[b.status]);

      const incomingIds = new Set(serverOrders.map(o => o.id));

      // Removed orders (deleted elsewhere) — fade out & drop.
      for (const [id] of knownOrders) {
        if (!incomingIds.has(id)) {
          const row = document.getElementById(`order-row-${id}`);
          if (row) {
            row.classList.add("order-row-removing");
            setTimeout(() => row.remove(), 350);
          }
          knownOrders.delete(id);
        }
      }

      serverOrders.forEach((order, idx) => {
        const existingStatus = knownOrders.get(order.id);

        if (existingStatus === undefined) {
          // Brand new order — this only fires on the FIRST tick after load
          // for orders that predate the page open; genuinely new ones during
          // the session arrive via handleIncomingOrder() with a sound.
          if (knownOrders.size > 0) {
            handleIncomingOrder(order, false);
          } else {
            insertOrderRow(order, false);
          }
          knownOrders.set(order.id, order.status);
        } else if (existingStatus !== order.status) {
          updateRowStatus(order);
          knownOrders.set(order.id, order.status);
        }

        reorderRowIfNeeded(order.id, idx);
      });
    }

    // Called for orders confirmed brand-new (via socket push or first-seen-mid-session)
    function handleIncomingOrder(order, viaSocket) {
      if (knownOrders.has(order.id)) return; // already rendered, avoid duplicate sound
      knownOrders.set(order.id, order.status);
      insertOrderRow(order, true);
      playNotificationSound();
      showToast(`New Order #${order.id} by ${order.customer_name} for ₹${order.total.toFixed(2)}`);
      notifications.unshift(order);
      localStorage.setItem("notifications", JSON.stringify(notifications));
      renderNotifications();
    }

    function insertOrderRow(order, isNew) {
      const html = buildOrderRow(order, isNew);
      elements.ordersTable.insertAdjacentHTML("afterbegin", html);
      if (isNew) {
        const row = document.getElementById(`order-row-${order.id}`);
        row?.classList.add("order-row-new");
        setTimeout(() => {
          row?.classList.remove("order-row-new");
          row?.querySelector(".new-flag")?.remove();
        }, 6000);
      }
    }

    function updateRowStatus(order) {
      const row = document.getElementById(`order-row-${order.id}`);
      if (!row) return;
      const pill = row.querySelector(".status-selected");
      if (pill) {
        pill.className = `status-selected status-pill ${order.status}`;
        pill.textContent = order.status;
        pill.setAttribute("onclick", `toggleDropdownStatus(event, ${order.id})`);
      }
      const cancelBtn = row.querySelector(".btn-cancel");
      const actionBtns = row.querySelector(".action-btns");
      if (actionBtns && (order.status === "Cancelled" || order.status === "Delivered")) {
        cancelBtn?.remove();
      }
      row.classList.remove("order-row-removing");
      row.style.animation = "none";
      requestAnimationFrame(() => { row.style.animation = ""; row.classList.add("order-row-new"); });
      setTimeout(() => row.classList.remove("order-row-new"), 2600);
    }

    // Keeps DOM order matching server sort without a full rebuild.
    function reorderRowIfNeeded(orderId, targetIndex) {
      const row = document.getElementById(`order-row-${orderId}`);
      if (!row) return;
      const currentRow = elements.ordersTable.children[targetIndex];
      if (currentRow !== row) {
        elements.ordersTable.insertBefore(row, currentRow || null);
      }
    }

    /* ================= RENDER HELPERS ================= */

    async function fetchOrders() {
      try {
        const res = await fetch("/api/orders", { credentials: "include" });
        const data = await res.json();
        elements.ordersTable.innerHTML = "";
        knownOrders.clear();

        if (!data.success || data.data.length === 0) {
          elements.ordersTable.innerHTML = "<tr class='no-orders-row'><td colspan='9' class='no-orders'>No orders found</td></tr>";
          return;
        }

        const statusPriority = { Pending: 1, Preparing: 2, Delivered: 3, Cancelled: 4 };
        data.data.sort((a, b) => statusPriority[a.status] - statusPriority[b.status]);

        data.data.forEach(order => {
          elements.ordersTable.insertAdjacentHTML("beforeend", buildOrderRow(order, false));
          knownOrders.set(order.id, order.status);
        });
        touchLastUpdated();
      } catch (err) {
        showToast("Error loading orders", false);
        console.error("Orders Load Error:", err);
      }
    }

    function buildOrderRow(order, isNew) {
      const items = Array.isArray(order.items)
        ? order.items.map(i => `<div>${i.name} (x${i.qty ?? 1})</div>`).join("")
        : `<div>${order.items}</div>`;
      const instructions = order.instructions || "None";
      const hasCoupon = !!order.coupon_code;
      const couponInfo = hasCoupon
        ? `${order.coupon_code} · -₹${order.discount.toFixed(2)}`
        : "No coupon used";

      return `
        <tr id="order-row-${order.id}">
          <td class="cell-customer">
            <span class="order-id">Order #${order.id}</span>
            <span class="customer-name">${order.customer_name}${isNew ? '<span class="new-flag">NEW</span>' : ''}</span>
          </td>
          <td data-label="Table">${order.table_number}</td>
          <td data-label="Items" class="cell-items"><div class="items-list">${items}</div></td>
          <td data-label="Total"><span class="total-price">₹${order.total.toFixed(2)}</span></td>
          <td data-label="Coupon" class="cell-coupon"><span class="coupon-info ${hasCoupon ? "has-coupon" : ""}">${couponInfo}</span></td>
          <td data-label="Address">${order.address || "None"}</td>
          <td data-label="Notes" class="cell-instructions"><span class="instructions">${instructions}</span></td>
          <td data-label="Status">
            <div class="status-dropdown">
              <div class="status-selected status-pill ${order.status}" onclick="toggleDropdownStatus(event, ${order.id})">${order.status}</div>
              <ul class="status-options" id="dropdown-${order.id}">
  <li onclick="updateStatus(${order.id}, 'Pending')">Pending</li>
  <li onclick="updateStatus(${order.id}, 'Accepted')">Accepted</li>
  <li onclick="updateStatus(${order.id}, 'Cooking')">Cooking</li>
  <li onclick="updateStatus(${order.id}, 'Delivered')">Delivered</li>
  <li onclick="updateStatus(${order.id}, 'Cancelled')">Cancelled</li>
</ul>
            </div>
          </td>
          <td class="cell-actions">
            <div class="actions-row">
              <div class="action-btns">
                ${order.status !== "Cancelled" && order.status !== "Delivered"
                  ? `<button class="btn btn-cancel" onclick="cancelOrder(${order.id})" title="Cancel Order"><i class="fas fa-ban"></i></button>`
                  : ""}
                <button class="btn btn-delete" onclick="deleteOrder(${order.id})" title="Delete Order"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function toggleDropdownStatus(event, id) {
      event.stopPropagation();
      const dropdown = document.getElementById(`dropdown-${id}`);
      if (!dropdown) return;
      const isShown = dropdown.classList.contains("show");
      document.querySelectorAll(".status-options").forEach(d => d.classList.remove("show"));
      if (!isShown) dropdown.classList.add("show");
    }

    async function updateStatus(id, status) {
      try {
        const res = await fetch(`/api/orders/${id}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Order #${id} marked as ${status}!`);
          document.querySelectorAll(".status-options").forEach(d => d.classList.remove("show"));
          knownOrders.set(id, status);
          updateRowStatus({ id, status });
        } else {
          showToast("Failed: " + data.message, false);
        }
      } catch (err) {
        showToast("Error updating status", false);
        console.error("Status Update Error:", err);
      }
    }

    async function cancelOrder(id) {
      if (!confirm("Are you sure you want to cancel this order?")) return;
      try {
        const res = await fetch(`/api/orders/${id}/cancel`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ status: "Cancelled" })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Order #${id} cancelled!`);
          knownOrders.set(id, "Cancelled");
          updateRowStatus({ id, status: "Cancelled" });
        } else {
          showToast("Failed: " + (data.message || "Unable to cancel order"), false);
        }
      } catch (err) {
        showToast("Error cancelling order", false);
        console.error("Cancel Error:", err);
      }
    }

    async function deleteOrder(id) {
      if (!confirm("Are you sure you want to delete this order?")) return;
      try {
        const res = await fetch(`/api/orders/${id}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          credentials: "include"
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Order #${id} deleted!`);
          const row = document.getElementById(`order-row-${id}`);
          if (row) {
            row.classList.add("order-row-removing");
            setTimeout(() => row.remove(), 350);
          }
          knownOrders.delete(id);
        } else {
          showToast("Failed: " + (data.message || "Unable to delete order"), false);
        }
      } catch (err) {
        showToast("Error deleting order", false);
        console.error("Delete Error:", err);
      }
    }

    async function logout() {
      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include"
        });
        window.location.href = "/admin.html";
      } catch (err) {
        console.error("Logout error:", err);
        window.location.href = "/admin.html";
      }
    }

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      return parts.length === 2 ? parts.pop().split(";").shift() : null;
    }
  </script>
</body>
